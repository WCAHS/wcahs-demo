            amber: { 50: '#fffbeb', 100: '#fef3c7', 200: '#fde68a', 300: '#fcd34d', 400: '#fbbf24', 500: '#f59e0b', 600: '#d97706', 700: '#b45309' },

    body { font-family: 'Nunito', sans-serif; background-color: #fdf8f3; }
    .font-display { font-family: 'Playfair Display', serif; }
    .sidebar-link { transition: all 0.15s ease; border-radius: 10px; }
    .sidebar-link:hover { background: rgba(255,255,255,0.1); }
    .sidebar-link.active { background: rgba(255,255,255,0.15); border-left: 3px solid #fbbf24; padding-left: 9px; }
    .badge { display: inline-flex; align-items: center; justify-content: center; min-width: 20px; height: 20px; font-size: 11px; font-weight: 700; border-radius: 999px; padding: 0 6px; }
    .card { background: white; border-radius: 16px; border: 1px solid #e8ebe3; box-shadow: 0 1px 3px rgba(59,68,52,0.04); }
    .card-warm { background: #fffcf8; border-radius: 16px; border: 1px solid #e8ebe3; box-shadow: 0 1px 3px rgba(59,68,52,0.04); }

    /* Quill overrides */
    .ql-toolbar.ql-snow { border-radius: 10px 10px 0 0; border-color: #d2d8c8; background: #f6f7f4; }
    .ql-container.ql-snow { border-radius: 0 0 10px 10px; border-color: #d2d8c8; min-height: 120px; font-family: 'Nunito', sans-serif; font-size: 14px; }
    .ql-editor { min-height: 100px; }

    /* Chart bar hover */
    .chart-bar { transition: opacity 0.15s; cursor: default; }
    .chart-bar:hover { opacity: 0.85; }
    .chart-bar-tooltip { display: none; position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); background: #3b4434; color: white; font-size: 11px; padding: 2px 8px; border-radius: 6px; white-space: nowrap; margin-bottom: 4px; }
    .chart-bar:hover .chart-bar-tooltip { display: block; }

    /* Inbox item accents — all within sage/amber/warm palette */
    .inbox-item { border-left: 4px solid transparent; transition: all 0.15s ease; }
    .inbox-item.type-contact { border-left-color: #93a27e; }
    .inbox-item.type-foster { border-left-color: #d97706; }
    .inbox-item.type-lost { border-left-color: #b45309; }
    .inbox-item.type-found { border-left-color: #48543e; }
    .inbox-item.unread { background: #f0f3ec; border-left-width: 5px; }
    .inbox-item.unread .inbox-name { font-weight: 800; color: #1f2937; }
    .inbox-item.unread .inbox-snippet { color: #374151; }
    .inbox-item.read { background: #fff; opacity: 0.7; }
    .inbox-item.read:hover { opacity: 1; }
    .inbox-item.read .inbox-name { font-weight: 600; color: #9ca3af; }
    .inbox-item.read .inbox-snippet { color: #d1d5db; }

    /* Status dots */
    .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
    .status-dot.new { background: #f59e0b; }
    .status-dot.contacted { background: #3b82f6; }
    .status-dot.followup { background: #8b5cf6; }
    .status-dot.closed { background: #9ca3af; }
    .status-dot.pending { background: #f59e0b; }
    .status-dot.approved { background: #22c55e; }
    .status-dot.resolved { background: #3b82f6; }
    .status-dot.rejected { background: #ef4444; }

    /* Filter tabs */
    .filter-tab { padding: 6px 16px; border-radius: 999px; font-size: 13px; font-weight: 600; transition: all 0.15s; cursor: pointer; border: 1.5px solid transparent; }
    .filter-tab.active { background: #48543e; color: white; border-color: #48543e; }
    .filter-tab:not(.active) { background: white; color: #6b7280; border-color: #e8ebe3; }
    .filter-tab:not(.active):hover { border-color: #b3bea3; color: #48543e; }

    .filter-tabs-scroll { display: flex; gap: 8px; flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 4px; scrollbar-width: none; }
    .filter-tabs-scroll::-webkit-scrollbar { display: none; }
    .filter-tabs-scroll .filter-tab { white-space: nowrap; flex-shrink: 0; }

      <form id="loginForm" class="space-y-4">
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">Username</label>
          <!-- autocapitalize/autocorrect off: a phone keyboard capitalises the first
               letter by default, which silently turns "admin" into "Admin" -->
          <input id="loginUser" type="text" autocapitalize="none" autocorrect="off" spellcheck="false" autocomplete="username" class="w-full border border-gray-200 rounded-2xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-sage-600" required>
        </div>
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">Password</label>
          <input id="loginPass" type="password" class="w-full border border-gray-200 rounded-2xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-sage-600" required>
        </div>
        <div class="cf-turnstile" data-sitekey="0x4AAAAAADpVDd5Mx-hY1fTZ" data-theme="light" data-callback="tsOk" data-error-callback="tsErr" data-expired-callback="tsExpired" data-timeout-callback="tsTimeout"></div>
        <!-- The live sitekey is bound to wcahs.org, so on a local dev server the
             widget never issues a token and the login can't be tested at all.
             Swap in Cloudflare's documented always-passes test key when — and
             only when — we're on localhost. This runs during parse, before the
             async api.js can render the widget, and `hostname` is never
             "localhost" in production. -->
        <script>
          if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
            document.currentScript.previousElementSibling
              .setAttribute('data-sitekey', '1x00000000000000000000AA');
          }
        </script>
        <div id="loginError" class="hidden text-red-600 text-sm"></div>
        <!-- Disabled until the CAPTCHA hands over a token. Tapping it earlier

        <button id="loginBtn" type="submit" disabled class="w-full bg-sage-700 hover:bg-sage-900 text-white font-bold py-3 rounded-2xl transition disabled:opacity-50 disabled:cursor-wait">Checking you're human…</button>

<script>
// ── Activity log ──
// What the page did, reported to /api/log and readable in Admin > Activity.
// Everything that went wrong in the October "it circles around" report
// happened here in the browser, where the server sees nothing. Never send a
// password, or anything typed into a form, through this.
const _visit = Math.random().toString(36).slice(2, 10);
const _t0 = Date.now();
function clog(event, detail) {
  try {
    const payload = JSON.stringify({ event, visit: _visit, detail: Object.assign({ t: Date.now() - _t0 }, detail || {}) });
    const blob = new Blob([payload], { type: 'application/json' });
    if (!(navigator.sendBeacon && navigator.sendBeacon('/api/log', blob))) {
      fetch('/api/log', { method: 'POST', body: payload, headers: { 'Content-Type': 'application/json' }, keepalive: true, credentials: 'same-origin' }).catch(() => {});
    }
  } catch (e) {}
}
window.addEventListener('error', e => clog('js_error', { msg: String(e.message).slice(0, 200), src: (e.filename || '').split('/').pop() + ':' + e.lineno }));
window.addEventListener('unhandledrejection', e => clog('js_error', { msg: 'unhandled: ' + String(e.reason && e.reason.message || e.reason).slice(0, 200) }));
clog('page_load', {
  hash: location.hash.slice(0, 60),
  standalone: !!(navigator.standalone || (window.matchMedia && matchMedia('(display-mode: standalone)').matches)),
  referrer: document.referrer ? new URL(document.referrer).host : '',
  w: window.innerWidth,
});
// Turnstile callbacks, named by data-* attributes on the widget. "slow" fires
// once if no token has arrived after 10s — the spinner a person sees as the
// page "circling".
let _tsDone = false;
function loginReady(ready, label) {
  const b = document.getElementById('loginBtn');
  if (!b) return;
  b.disabled = !ready;
  b.textContent = label || (ready ? 'Log In' : 'Checking you\'re human…');
}
function tsOk() { _tsDone = true; loginReady(true); clog('turnstile', { state: 'token' }); }
function tsErr(code) { loginReady(false, 'Security check failed — reload the page'); clog('turnstile', { state: 'error', code: String(code || '') }); }
function tsExpired() { loginReady(false); clog('turnstile', { state: 'expired' }); }
function tsTimeout() { clog('turnstile', { state: 'timeout' }); }
setTimeout(() => {
  if (!_tsDone && !document.getElementById('loginScreen').classList.contains('hidden')) clog('turnstile', { state: 'slow', loaded: !!window.turnstile });
}, 10000);

// ── API helpers ──
async function api(path, opts = {}) {
  const fetchOpts = {
    method: opts.method || 'GET',
    credentials: 'same-origin',
    headers: { 'Content-Type': 'application/json', ...opts.headers },
  };
  if (opts.body) fetchOpts.body = JSON.stringify(opts.body);
  const res = await fetch('/api' + path, fetchOpts);
  if (res.status === 401 && !path.includes('/auth/')) {
    clog('session_expired', { path: path.split('?')[0] });
    document.getElementById('dashboard').classList.add('hidden');
    document.getElementById('loginScreen').classList.remove('hidden');
    return { error: 'Session expired' };
  }
  return res.json();
}

// ── Auth ──
let isSetup = false;

async function checkAuth() {
  const started = Date.now();
  try {
    const res = await api('/auth/me');
    if (res.username) { clog('auth_check', { result: 'signed_in', ms: Date.now() - started }); showDashboard(res); return; }
    clog('auth_check', { result: 'signed_out', ms: Date.now() - started });
  } catch(e) {
    console.error('Auth check failed:', e);
    clog('auth_check', { result: 'error', msg: String(e && e.message).slice(0, 200), ms: Date.now() - started });
  }
  document.getElementById('authLoading').classList.add('hidden');
  document.getElementById('loginScreen').classList.remove('hidden');
}

document.getElementById('loginForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  const user = document.getElementById('loginUser').value;
  const pass = document.getElementById('loginPass').value;
  const errEl = document.getElementById('loginError');
  errEl.textContent = 'Logging in...';
  errEl.style.color = '#5c6b4e';
  errEl.classList.remove('hidden');

  const turnstileEl = document.querySelector('[name="cf-turnstile-response"]');
  const turnstileToken = turnstileEl ? turnstileEl.value : '';

  try {
    // Setup call (only matters on first-ever login)
    await api('/auth/setup', { method: 'POST', body: { username: user, password: pass } }).catch(function(){});

    const loginRes = await api('/auth/login', { method: 'POST', body: { username: user, password: pass, turnstile_token: turnstileToken } });
    clog('login', { ok: loginRes.ok ? 1 : 0, error: loginRes.error || '', had_token: !!turnstileToken });
    if (loginRes.ok) {
      showDashboard(loginRes);
    } else {
      errEl.textContent = loginRes.error || 'Login failed';
      errEl.style.color = '#dc2626';
      errEl.classList.remove('hidden');
      resetTurnstile();
    }
  } catch(loginErr) {
    clog('login', { ok: 0, error: 'exception: ' + String(loginErr.message).slice(0, 200) });
    errEl.textContent = 'Login error: ' + loginErr.message;
    errEl.style.color = '#dc2626';
    errEl.classList.remove('hidden');
    resetTurnstile();
  }
});

// Turnstile tokens are single-use. Without this, a second attempt after a wrong
// password re-submits the spent token and fails as "CAPTCHA verification failed"
// no matter how correct the password is.
function resetTurnstile() {
  loginReady(false);
  try { if (window.turnstile && typeof window.turnstile.reset === 'function') window.turnstile.reset(); } catch (e) {}
}

let currentRole = 'staff';
let currentUsername = '';

// Pages a role may land on. The saved page has to be checked against this too —
// restoring it blindly dropped fosters on the Inbox, which they can't read.
const PAGES_BY_ROLE = {
  admin:  ['submissions','pets','lost-found','events','forms','links','faq','settings','about','users','my-account','analytics','activity','foster-pets'],
  staff:  ['submissions','pets','lost-found','events','forms','my-account'],
  foster: ['foster-pets','my-account']
};

function showDashboard(user) {
  try {
    currentRole = user.role;
    currentUsername = user.username;
    document.getElementById('authLoading').classList.add('hidden');
    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('dashboard').classList.remove('hidden');
    document.getElementById('loggedInAs').textContent = user.username + ' (' + user.role + ')';
    if (user.role !== 'admin') {
      document.querySelectorAll('.admin-only').forEach(el => el.style.display = 'none');
    }
    if (user.role !== 'admin' && user.role !== 'staff') {
      document.querySelectorAll('.staff-visible').forEach(el => el.style.display = 'none');
    }
    // Foster role: hide all nav, show only My Pets + My Account
    if (user.role === 'foster') {
      document.querySelectorAll('#sidebar nav > *').forEach(el => el.style.display = 'none');
      // Insert foster-only nav items
      const nav = document.querySelector('#sidebar nav');
      const fosterNav = document.createElement('div');
      fosterNav.id = 'fosterNavItems';
      fosterNav.innerHTML = `
        <a onclick="navigate('foster-pets')" class="sidebar-link block px-3 py-2.5 text-sm cursor-pointer" data-nav="foster-pets">My Pets</a>
        <a onclick="navigate('my-account')" class="sidebar-link block px-3 py-2.5 text-sm cursor-pointer" data-nav="my-account">My Account</a>
      `;
      nav.prepend(fosterNav);
    }
    const validPages = PAGES_BY_ROLE[user.role] || PAGES_BY_ROLE.staff;
    const savedPage = sessionStorage.getItem('wcahs_admin_page');
    const defaultPage = user.role === 'foster' ? 'foster-pets' : 'submissions';
    // A deep link decides the page itself. Rendering the saved page first and
    // letting the link re-navigate a moment later meant two async renders were
    // writing to #content at once, and on a slow connection the saved page's
    // fetch could land last and wipe out the report the link had just opened.
    if (!followDeepLink()) navigate(validPages.includes(savedPage) ? savedPage : defaultPage);
    if (user.role !== 'foster') loadBadgeCounts();
  } catch(e) {
    console.error('Dashboard error:', e);
    document.getElementById('content').innerHTML = '<p class="text-red-500">Error loading dashboard: ' + e.message + '</p>';
  }
}

// ── Navigation ──
function navigate(page) {
  var sb = document.getElementById('sidebar');
  if (sb) sb.classList.remove('open');
  document.querySelectorAll('.sidebar-link').forEach(l => l.classList.remove('active'));
  const link = document.querySelector(`[data-nav="${page}"]`);
  if (link) link.classList.add('active');
  const content = document.getElementById('content');
  _quillInstances = {};
  try { sessionStorage.setItem('wcahs_admin_page', page); } catch(e) {}
  clog('nav', { page });
  switch(page) {
    case 'submissions': renderSubmissions(content); break;
    case 'pets': renderPets(content); break;
    case 'lost-found': renderLostFoundManage(content); break;
    case 'events': renderEvents(content); break;
    // 'clinic' kept as an alias: it's in older notification emails.
    case 'forms':
    case 'clinic': renderClinic(content); break;
    case 'links': renderShortLinks(content); break;
    case 'email': renderEmail(content); break;
    case 'faq': renderFaq(content); break;
    case 'settings': renderSettings(content); break;
    case 'about': renderAbout(content); break;
    case 'users': renderUsers(content); break;
    case 'my-account': renderMyAccount(content); break;
    case 'analytics': renderAnalytics(content); break;
    case 'activity': renderActivity(content); break;
    case 'foster-pets': renderFosterPets(content); break;
    default: sessionStorage.removeItem('wcahs_admin_page'); renderSubmissions(content); break;
  }
}

// ── Helpers ──
// Approving a report moves it to a different section, which used to happen in
// total silence — the row simply vanished from the inbox and nothing said where
// it had gone. Anything that moves a record between sections says so here.
function toast(message, tone) {
  let el = document.getElementById('toast');
  if (!el) {
    el = document.createElement('div');
    el.id = 'toast';
    // Top, not bottom: Safari on iPhone floats its address bar over the bottom of
    // the page, and a toast at bottom:24px sat underneath it, unseen.
    el.style.cssText = 'position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top) + 12px);z-index:100;' +
      'max-width:calc(100vw - 32px);padding:12px 20px;border-radius:14px;font-size:14px;font-weight:600;' +
      'box-shadow:0 8px 24px rgba(0,0,0,.18);text-align:center;transition:opacity .25s';
    document.body.appendChild(el);
  }
  clog('toast', { message: String(message).slice(0, 160), tone: tone || '' });
  el.style.background = tone === 'error' ? '#dc2626' : '#48543e';
  el.style.color = '#fff';
  el.textContent = message;
  el.style.opacity = '1';
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.style.opacity = '0'; }, 8000);
}

function h(str) { const d = document.createElement('div'); d.textContent = str; return d.innerHTML; }
function zohoCompose(to, subject) { window.open('https://mail.zoho.com/zm/#/compose?to='+encodeURIComponent(to)+(subject?'&subject='+encodeURIComponent(subject):''), 'zoho_compose', 'width=700,height=600,scrollbars=yes,resizable=yes'); }
function fmtPhone(p) { if(!p)return''; const d=p.replace(/\D/g,''); if(d.length===10)return'('+d.substring(0,3)+') '+d.substring(3,6)+'-'+d.substring(6); if(d.length===11&&d[0]==='1')return'('+d.substring(1,4)+') '+d.substring(4,7)+'-'+d.substring(7); return p; }
function formatDate(d) { if (!d) return ''; return new Date(d + 'T00:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }); }
function timeAgo(dt) {
  const d = new Date(dt.endsWith('Z') ? dt : dt + 'Z'); const now = new Date(); const diff = Math.floor((now - d) / 1000);
  if (diff < 60) return 'just now'; if (diff < 3600) return Math.floor(diff/60) + 'm ago';
  if (diff < 86400) return Math.floor(diff/3600) + 'h ago'; return Math.floor(diff/86400) + 'd ago';
}
function localTime(dt) {
  if (!dt) return '';
  const fixed = dt.replace(' ', 'T').replace(/([^Z])$/, '$1Z');
  const d = new Date(fixed);
  if (isNaN(d)) return '';
  return d.toLocaleString('en-US', { month:'short', day:'numeric', hour:'numeric', minute:'2-digit', hour12:true });
}
function minutesAgo(dt) {
  if (!dt) return null;
  // D1 timestamps are UTC but formatted as "2026-06-23 23:21:08" — need T separator and Z suffix
  const fixed = dt.replace(' ', 'T').replace(/([^Z])$/, '$1Z');
  const d = new Date(fixed);
  if (isNaN(d)) return null;
  return Math.floor((new Date() - d) / 60000);
}

// ── Quill helpers ──
let _quillInstances = {};

function initQuill(containerId, initialHtml) {
  setTimeout(() => {
    const container = document.getElementById(containerId);
    if (!container) return;
    const q = new Quill('#' + containerId, {
      theme: 'snow',
      modules: {
        toolbar: [['bold', 'italic', 'underline'], ['link'], [{ list: 'ordered' }, { list: 'bullet' }]]
      }
    });
    if (initialHtml) {
      // Clean up plain text with newlines — convert to paragraphs if no HTML tags present
      let cleaned = initialHtml;
      if (!/<[a-z][\s\S]*>/i.test(cleaned)) {
        cleaned = cleaned.split(/\n\n+/).map(p => '<p>' + p.replace(/\n/g, '<br>') + '</p>').join('');
      }
      q.root.innerHTML = cleaned;
    }
    _quillInstances[containerId] = q;
  }, 50);
}

function getQuillHtml(containerId) {
  const q = _quillInstances[containerId];
  if (!q) return '';
  const html = q.root.innerHTML;
  return html === '<p><br></p>' ? '' : html;
}

// Contact messages and foster applications. Lost & Found reports used to be

let _inboxFilter = 'all';

async function renderSubmissions(el) {
  el.innerHTML = '<h1 class="text-2xl font-display font-bold text-sage-800 mb-6">Inbox</h1><p class="text-gray-400">Loading...</p>';
  const archive = _inboxFilter === 'archive';
  const [subs, archived] = await Promise.all([
    api('/admin/submissions'),
    api('/admin/submissions?archived=1'),
  ]);
  if (subs.error) { el.innerHTML += '<p class="text-red-500">' + h(subs.error) + '</p>'; return; }
  const live = Array.isArray(subs) ? subs : [];
  const old = Array.isArray(archived) ? archived : [];
  _subsData = live.concat(old);

  const toItem = s => {
    let phone = '';
    let msg = s.message;
    const phoneMatch = msg.match(/^Phone: (.+?)\n\n/);
    if (phoneMatch) { phone = phoneMatch[1]; msg = msg.replace(phoneMatch[0], ''); }
    return { kind: 'submission', itemType: s.type, id: s.id, name: s.name, email: s.email, phone,
      subject: s.subject, message: msg, rawMessage: s.message, status: s.status || 'new',
      is_read: s.is_read, created_at: s.created_at, archived: !!s.archived_at, _raw: s };
  };
  const counts = {
    all: live.length,
    contact: live.filter(i => i.type === 'contact').length,
    foster: live.filter(i => i.type === 'foster').length,
    archive: old.length,
  };
  const shown = (archive ? old : live).map(toItem)
    .filter(i => archive || _inboxFilter === 'all' || i.itemType === _inboxFilter)
    .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

  const tabBtn = (key, label) =>
    `<button onclick="_inboxFilter='${key}';renderSubmissions(document.getElementById('content'))" class="filter-tab ${_inboxFilter === key ? 'active' : ''}">${label} (${counts[key]})</button>`;

  let html = `<h1 class="text-2xl font-display font-bold text-sage-800 mb-5">Inbox</h1>
    <div class="filter-tabs-scroll mb-3">
      ${tabBtn('all', 'All')}
      ${tabBtn('contact', 'Contact')}
      ${tabBtn('foster', 'Foster')}
      ${tabBtn('archive', 'Archive')}
    </div>
    <p class="text-xs text-gray-400 mb-4">${archive
      ? 'Archived messages. Nothing here is deleted.'
      : 'Read messages move to Archive by themselves after 30 days. Lost &amp; found reports are under <a onclick="navigate(\'lost-found\')" class="text-sage-600 underline cursor-pointer">Lost &amp; Found</a>.'}</p>`;

  if (shown.length === 0) {
    html += `<div class="card p-10 text-center">
      <svg class="w-16 h-16 mx-auto text-sage-200 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-2.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"/></svg>
      <p class="text-gray-400 font-semibold">${archive ? 'Archive is empty' : 'Inbox is empty'}</p>
    </div>`;
    el.innerHTML = html;
    return;
  }

  // Bulk bar: always visible so it's discoverable, buttons light up once
  // something is ticked.
  html += `<div id="bulkBar" class="card px-3.5 py-2.5 mb-2 flex items-center gap-3 flex-wrap sticky top-0 md:top-0 z-30">
      <label class="flex items-center gap-2 text-sm text-gray-600 cursor-pointer"><input type="checkbox" id="bulkAll" onchange="bulkSelectAll(this.checked)" class="w-4 h-4 rounded border-gray-300"> <span id="bulkCount">Select</span></label>
      <div class="flex items-center gap-2 ml-auto">
        ${archive
          ? `<button data-bulk onclick="bulkInbox('unarchive')" disabled class="text-xs font-semibold px-3 py-1.5 rounded-lg bg-sage-50 text-sage-700 disabled:opacity-40">Move to Inbox</button>`
          : `<button data-bulk onclick="bulkInbox('archive')" disabled class="text-xs font-semibold px-3 py-1.5 rounded-lg bg-sage-600 text-white disabled:opacity-40">Archive</button>
             <button data-bulk onclick="bulkInbox('read')" disabled class="text-xs font-semibold px-3 py-1.5 rounded-lg bg-sage-50 text-sage-700 disabled:opacity-40">Mark read</button>`}
        <button data-bulk onclick="bulkInbox('delete')" disabled class="text-xs font-semibold px-3 py-1.5 rounded-lg text-red-500 disabled:opacity-40">Delete</button>
      </div>
    </div>`;

  html += '<div id="inboxList" class="space-y-1">';
  shown.forEach(item => {
    const unread = !item.is_read;
    const typeLabels = { contact: 'Contact', foster: 'Foster App' };
    const typeLabelColors = { contact: '#93a27e', foster: '#d97706' };
    let typeLabel = typeLabels[item.itemType] || item.itemType;
    if (item.itemType === 'contact' && item.subject) typeLabel = item.subject;
    const typeLabelColor = typeLabelColors[item.itemType] || '#6b7280';
    const nameParts = (item.name || '?').split(' ');
    const initials = nameParts.length > 1 ? nameParts[0].charAt(0) + nameParts[nameParts.length-1].charAt(0) : nameParts[0].charAt(0);
    let snippet = item.message ? item.message.substring(0, 80) : (item.subject || '');
    if (item.message && item.message.length > 80) snippet += '...';
    const clickId = 'sub-' + item.id, arrowId = 'sub-arrow-' + item.id;
    const markReadCall = unread ? `markRead(${item.id}, true);` : '';

    html += `<div class="inbox-item card type-${item.itemType} ${unread ? 'unread' : 'read'} overflow-hidden" data-type="${item.itemType}">
      <div class="flex items-center gap-3 p-3.5 cursor-pointer hover:bg-warm-50 transition" onclick="toggleInboxItem('${clickId}', '${arrowId}'); ${markReadCall}">
        <input type="checkbox" class="inbox-check w-4 h-4 rounded border-gray-300 shrink-0" data-id="${item.id}" onclick="event.stopPropagation(); bulkChanged()">

            <span class="inbox-name text-gray-900 text-sm ${unread ? '' : 'font-normal'}">${h(item.name)}</span>
            <span class="text-[10px] text-gray-300">&middot;</span>

            <span class="text-[11px] text-gray-300 ml-auto shrink-0">${timeAgo(item.created_at)}</span>
          </div>
          <p class="inbox-snippet text-xs text-gray-400 truncate">${h(snippet)}</p>
        </div>
        <svg class="w-4 h-4 text-gray-300 shrink-0 transition-transform ml-1" id="${arrowId}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
      </div>
      <div id="${clickId}" class="hidden border-t border-sage-100">${renderSubExpanded(item)}</div>
    </div>`;
  });
  html += '</div>';
  el.innerHTML = html;
}

function bulkSelected() {
  return Array.from(document.querySelectorAll('.inbox-check:checked')).map(c => Number(c.dataset.id));
}
window.bulkChanged = function() {
  const n = bulkSelected().length;
  const total = document.querySelectorAll('.inbox-check').length;
  document.querySelectorAll('[data-bulk]').forEach(b => b.disabled = n === 0);
  const all = document.getElementById('bulkAll');
  if (all) { all.checked = n > 0 && n === total; all.indeterminate = n > 0 && n < total; }
  const c = document.getElementById('bulkCount');
  if (c) c.textContent = n ? n + ' selected' : 'Select';
};
window.bulkSelectAll = function(on) {
  document.querySelectorAll('.inbox-check').forEach(c => c.checked = on);
  bulkChanged();
};
window.bulkOne = function(action, id) {
  document.querySelectorAll('.inbox-check').forEach(c => c.checked = Number(c.dataset.id) === id);
  return bulkInbox(action);
};
window.bulkInbox = async function(action) {
  const ids = bulkSelected();
  if (!ids.length) return;
  if (action === 'delete' && !confirm(`Permanently delete ${ids.length} message${ids.length > 1 ? 's' : ''}? Archive keeps them instead.`)) return;
  const res = await api('/admin/submissions/bulk', { method: 'POST', body: { action, ids } });
  if (!res || res.error) { toast(res && res.error ? res.error : 'That didn’t work — try again.', 'error'); return; }
  const n = ids.length, s = n > 1 ? 's' : '';
  toast({ archive: `Archived ${n} message${s}.`, unarchive: `Moved ${n} message${s} back to the Inbox.`,
    read: `Marked ${n} as read.`, delete: `Deleted ${n} message${s}.` }[action] || 'Done.');
  loadBadgeCounts();
  renderSubmissions(document.getElementById('content'));
};

    </select>

    <button onclick="event.stopPropagation(); bulkOne('${item.archived ? 'unarchive' : 'archive'}', ${item.id})" class="text-xs text-sage-700 hover:underline ml-auto">${item.archived ? 'Move to Inbox' : 'Archive'}</button>
    <button onclick="event.stopPropagation(); if(confirm('Delete this submission?')) deleteSub(${item.id})" class="text-xs text-red-400 hover:underline">Delete</button>
  </div>`;
}

// Date + place block for a report, exact (staff view). Older reports only
// have the free-text box, which shows as "Details".
function lfDateLabel(d) {
  return d ? new Date(d + 'T12:00:00Z').toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', timeZone: 'UTC' }) : '';
}
function lfPlaceHtml(r) {
  const seen = r.type === 'lost' ? 'Last seen' : 'Found';
  const map = r.lat != null ? ` <a href="https://www.openstreetmap.org/?mlat=${r.lat}&mlon=${r.lng}#map=17/${r.lat}/${r.lng}" target="_blank" class="text-sage-600 underline text-xs">map</a>` : '';
  let out = '';
  if (r.seen_date || r.address || r.lat != null) {
    out += `<h4 class="text-xs font-bold text-gray-400 uppercase tracking-wider mt-4 mb-2">${seen}</h4>
      <p class="text-sm font-semibold">${h(lfDateLabel(r.seen_date) || 'Date not given')}</p>
      <p class="text-sm">${r.address ? h(r.address) : (r.lat != null ? 'Pin on map' : '<span class="text-gray-300">No place given</span>')}${map}</p>`;
  }
  if (r.location_details) out += `<h4 class="text-xs font-bold text-gray-400 uppercase tracking-wider mt-4 mb-2">${r.seen_date || r.address ? 'Details' : 'Date &amp; location'}</h4><p class="text-sm font-semibold">${h(r.location_details)}</p>`;
  return out;
}

          <p><span class="text-gray-400 w-24 inline-block">Temperament:</span> <span class="font-semibold">${r.temperament ? h(r.temperament) : '<span class="text-gray-300">&mdash;</span>'}</span></p>

    ${photos.length > 0 ? '<div class="mb-4"><h4 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Photos</h4><div class="flex flex-wrap gap-3">'+photos.map(p=>'<img src="'+p+'" class="w-24 h-24 rounded-xl object-cover">').join('')+'</div></div>' : ''}
    <div class="flex items-center gap-3 flex-wrap pt-3 border-t border-sage-100">

window.toggleInboxItem = function(elId, arrowId) {
  var el = document.getElementById(elId);
  var arrow = document.getElementById(arrowId);
  if (!el) return;
  el.classList.toggle('hidden');
  if (arrow) arrow.style.transform = el.classList.contains('hidden') ? '' : 'rotate(180deg)';
};

window.filterInbox = function(type) {
  _inboxFilter = type;
  document.querySelectorAll('.filter-tab').forEach(b => b.classList.remove('active'));
  if (event && event.target) event.target.classList.add('active');
  document.querySelectorAll('.inbox-item').forEach(el => {
    el.style.display = (type === 'all' || el.dataset.type === type) ? '' : 'none';
  });
};

// Keep old function names working
window.filterSubs = window.filterInbox;

window.toggleSub = function(id) {
  toggleInboxItem('sub-' + id, 'sub-arrow-' + id);
};

window.markRead = async function(id, read) {
  await api('/admin/submissions/' + id, { method: 'PUT', body: { is_read: read } });
  const item = document.querySelector('.inbox-item:has(#sub-' + id + ')');
  if (item && read) {
    item.classList.remove('unread'); item.classList.add('read');
  } else if (item && !read) {
    item.classList.remove('read'); item.classList.add('unread');
    // Collapse the expanded detail when marking unread
    var detail = document.getElementById('sub-' + id);
    var arrow = document.getElementById('sub-arrow-' + id);
    if (detail && !detail.classList.contains('hidden')) { detail.classList.add('hidden'); if (arrow) arrow.style.transform = ''; }
  }
  // Swap the button text
  if (item) {
    const btn = item.querySelector('button[onclick*="markRead"]');
    if (btn) {
      btn.textContent = read ? 'Mark unread' : 'Mark read';
      btn.className = read ? 'text-xs text-gray-400 hover:underline' : 'text-xs text-sage-700 hover:underline';
      btn.setAttribute('onclick', 'event.stopPropagation(); markRead(' + id + ', ' + !read + ')');
    }
  }
  loadBadgeCounts();
};

window.updateSubStatus = async function(id, status) {
  await api('/admin/submissions/' + id, { method: 'PUT', body: { status: status, is_read: true } });
  loadBadgeCounts();
};

window.deleteSub = async function(id) {
  await api('/admin/submissions/' + id, { method: 'DELETE' });
  navigate('submissions'); loadBadgeCounts();
};

// ── Editing and adding reports ──
// Until now a report could only be changed as a side effect of the poster:
// Generate Poster → edit → Save Poster → Post to Website, which meant a typo
// couldn't be fixed without rendering and storing a poster image. And a phone-in
// ("there's a cat on my porch") couldn't be entered at all. Both go through this
// one form so the two can't drift apart.
const LF_SPECIES = ['Dog', 'Cat', 'Other'];
const LF_GENDER = ['Male', 'Female', 'Unknown'];
const LF_TEMPERAMENT = ['Friendly / Approachable', 'Scared / Skittish',
  'Aggressive / Do Not Approach', "Unknown / Couldn't Get Close"];
const LF_COLLAR = ['No collar', 'Collar but no tags', 'Collar with tags', "Couldn't tell"];

function lfField(label, id, value, opts) {
  opts = opts || {};
  const v = value == null ? '' : String(value);
  const control = opts.options
    ? `<select id="${id}" class="w-full border border-gray-200 rounded-xl px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-sage-400">
         ${opts.allowBlank === false ? '' : '<option value=""></option>'}
         ${opts.options.map(o => `<option${o === v ? ' selected' : ''}>${h(o)}</option>`).join('')}
       </select>`
    : opts.textarea
      ? `<textarea id="${id}" rows="3" class="w-full border border-gray-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-sage-400">${h(v)}</textarea>`
      : `<input id="${id}" value="${h(v)}" class="w-full border border-gray-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-sage-400">`;
  return `<div class="${opts.wide ? 'sm:col-span-2' : ''}">
    <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">${h(label)}${opts.required ? ' <span class="text-red-400">*</span>' : ''}</label>
    ${control}
  </div>`;
}

      ${lfField('Report type', 'lf-f-type', r.type === 'found' ? 'Found pet' : 'Lost pet',
        { options: ['Lost pet', 'Found pet'], allowBlank: false, required: true })}
      ${lfField('Species', 'lf-f-species', r.species || '', { options: LF_SPECIES, required: true })}
      ${lfField('Pet name', 'lf-f-pet_name', r.pet_name)}
      ${lfField('Breed', 'lf-f-breed', r.breed)}
      ${lfField('Color', 'lf-f-color', r.color)}
      ${lfField('Gender', 'lf-f-gender', r.gender || '', { options: LF_GENDER })}
      ${lfField('Collar details', 'lf-f-collar_details', r.collar_details)}
      ${lfField('Collar status', 'lf-f-collar_status', r.collar_status || '', { options: LF_COLLAR })}
      ${lfField('Temperament', 'lf-f-temperament', r.temperament || '', { options: LF_TEMPERAMENT })}
      ${lfField('Currently', 'lf-f-current_location', r.current_location)}
      <div>
        <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Date seen / found</label>
        <input id="lf-f-seen_date" type="date" value="${h(r.seen_date || '')}" max="${new Date().toLocaleDateString('en-CA')}" class="w-full border border-gray-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-sage-400">
      </div>
      <div class="sm:col-span-2">
        <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Where</label>
        <input id="lf-f-address" value="${h(r.address || '')}" placeholder="Start typing an address or place" class="w-full border border-gray-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-sage-400">
        <input type="hidden" id="lf-f-lat" value="${r.lat ?? ''}"><input type="hidden" id="lf-f-lng" value="${r.lng ?? ''}">
        <div id="lf-f-map" class="mt-2 rounded-xl overflow-hidden border border-gray-200" style="height:220px"></div>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-x-5 gap-y-4">

             class="block w-full text-sm text-gray-500 file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-sage-50 file:text-sage-700">
      <p class="text-[11px] text-gray-400 mt-1">Up to 5, 10MB each.</p>
      <label class="flex items-center gap-2 mt-4 text-sm text-gray-600">

// Wire the editor's address box and map together once the modal is on screen.
function initLFPlace() {
  if (!window.WCAHSMap) return;
  const lat = document.getElementById('lf-f-lat'), lng = document.getElementById('lf-f-lng');
  const picker = WCAHSMap.picker(document.getElementById('lf-f-map'), {
    lat: lat.value === '' ? null : Number(lat.value), lng: lng.value === '' ? null : Number(lng.value),
    onChange: (a, b) => { lat.value = a.toFixed(6); lng.value = b.toFixed(6); },
  });
  WCAHSMap.addressInput(document.getElementById('lf-f-address'), {
    onPick: it => { lat.value = it.lat; lng.value = it.lng; picker.setPoint(it.lat, it.lng); },
  });
}

function lfModal(title, innerHtml, onSave, saveLabel) {
  const overlay = document.createElement('div');
  overlay.className = 'fixed inset-0 z-50 flex items-start justify-center overflow-y-auto p-4';
  overlay.style.background = 'rgba(0,0,0,.45)';
  overlay.innerHTML = `<div class="bg-white rounded-2xl w-full max-w-2xl my-6 shadow-xl">
      <div class="flex items-center justify-between px-6 py-4 border-b border-sage-100 sticky top-0 bg-white rounded-t-2xl">
        <h3 class="font-display font-bold text-lg text-sage-800">${h(title)}</h3>
        <button class="text-gray-300 hover:text-gray-500 text-2xl leading-none" data-close>&times;</button>
      </div>
      <div class="px-6 py-5" id="lf-modal-body">${innerHtml}</div>
      <div class="flex gap-3 px-6 py-4 border-t border-sage-100">
        <button id="lf-modal-save" class="bg-sage-700 hover:bg-sage-800 text-white font-semibold text-sm px-5 py-2.5 rounded-xl transition">${h(saveLabel || 'Save Changes')}</button>
        <button class="text-sm text-gray-500 px-4 py-2.5" data-close>Cancel</button>
      </div>
    </div>`;
  overlay.querySelectorAll('[data-close]').forEach(b => b.onclick = () => overlay.remove());
  overlay.onclick = e => { if (e.target === overlay) overlay.remove(); };
  const saveBtn = overlay.querySelector('#lf-modal-save');
  saveBtn.onclick = async () => {
    saveBtn.disabled = true;
    const original = saveBtn.textContent;
    saveBtn.textContent = 'Saving...';
    const ok = await onSave();
    if (ok) overlay.remove();
    else { saveBtn.disabled = false; saveBtn.textContent = original; }
  };
  document.body.appendChild(overlay);
  if (document.getElementById('lf-f-map')) initLFPlace();
}

window.editReport = function(id) {
  // Both pages cache reports, and either cache can be left over from an earlier
  // visit. Trust the one belonging to the page actually on screen, or an edit
  // made here could be seeded from a stale copy and quietly undo itself.
  const first = _lfManageData, second = _lfData;
  const match = list => (list || []).find(x => String(x.id) === String(id));
  const r = match(first) || match(second);
  if (!r) { toast('Could not find that report — try reloading.', 'error'); return; }
  lfModal('Edit Report', lfEditorMarkup(r, false), async () => {
    const payload = lfReadEditor();
    if (!payload.species) { toast('Species is required.', 'error'); return false; }
    const res = await api('/admin/lost-found/' + id, { method: 'PUT', body: payload });
    if (!res || res.error) { toast(res && res.error ? res.error : 'Could not save those changes.', 'error'); return false; }
    toast('Changes saved.');
    navigate('lost-found');
    whenRendered('lf-card-' + id, () => openLFCard(id));
    return true;
  });
};

window.addReport = function() {
  lfModal('Add a Report', lfEditorMarkup({ type: 'found' }, true), async () => {
    const payload = lfReadEditor();
    if (!payload.species) { toast('Species is required.', 'error'); return false; }
    payload.status = document.getElementById('lf-f-hold')?.checked ? 'pending' : 'approved';

    const fileInput = document.getElementById('lf-f-photos');
    const files = fileInput && fileInput.files ? Array.from(fileInput.files) : [];
    if (files.length > 5) { toast('Five photos maximum.', 'error'); return false; }
    if (files.length) {
      const fd = new FormData();
      files.forEach(f => fd.append('photos', f));
      const up = await fetch('/api/upload', { method: 'POST', body: fd, credentials: 'same-origin' })
        .then(r => r.json()).catch(() => null);
      if (!up || up.error || !up.urls) { toast(up && up.error ? up.error : 'Photo upload failed.', 'error'); return false; }
      payload.photo_urls = up.urls;
    }

    const res = await api('/admin/lost-found', { method: 'POST', body: payload });
    if (!res || res.error) { toast(res && res.error ? res.error : 'Could not add that report.', 'error'); return false; }
    loadBadgeCounts();
    if (res.status === 'approved') {
      _lfManageFilter = 'active';
      navigate('lost-found');
      toast('Added — it’s live on the public Lost & Found page now.');
      whenRendered('lf-card-' + res.id, el => {
        el.classList.add('ring-2', 'ring-sage-400');
        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      });
    } else {
      _lfManageFilter = 'review';
      navigate('lost-found');
      toast('Added — it’s under Needs review, not on the website yet.');
    }
    return true;
  }, 'Add Report');
};

window.updateReport = async function(id, status) {
  const res = await api('/admin/lost-found/' + id, { method: 'PUT', body: { status } });
  clog('report_action', { id, status, ok: (res && !res.error) ? 1 : 0, error: (res && res.error) || '' });
  // The old version ignored the response entirely, so a failed save looked
  // exactly like a successful one: the inbox re-rendered either way.
  if (!res || res.error) {
    toast(res && res.error ? res.error : 'Could not save that — try again.', 'error');
    return;
  }
  loadBadgeCounts();
  if (status === 'approved') {
    // Approved reports leave the inbox for the Lost & Found section, which on a
    // phone is hidden behind the hamburger menu. Take her there and point at the
    // report rather than dropping her back on an inbox it just disappeared from.
    _lfManageFilter = 'active';
    navigate('lost-found');
    toast('Approved — it’s live on the public Lost & Found page and map now.');
    whenRendered('lf-card-' + id, (el) => {
      el.classList.add('ring-2', 'ring-sage-400');
      el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    });
    return;
  }
  _lfManageFilter = status === 'rejected' ? 'rejected' : _lfManageFilter;
  navigate('lost-found');
  toast(status === 'rejected' ? 'Rejected — kept under the Rejected tab, off the website.' : 'Saved.');
};

window.resolveReport = async function(id) {
  const note = prompt('Resolution note (e.g., "Reunited with owner"):');
  if (note === null) return;
  const res = await api('/admin/lost-found/' + id, { method: 'PUT', body: { status: 'resolved', resolved_note: note || '' } });
  if (!res || res.error) { toast(res && res.error ? res.error : 'Could not save that — try again.', 'error'); return; }
  loadBadgeCounts();
  _lfManageFilter = 'resolved';
  navigate('lost-found');
  toast('Marked resolved — it’s off the public page, under Resolved.');
};

window.generatePoster = function(report) {
  sessionStorage.setItem('wcahs_poster_data', JSON.stringify(report));
  window.open('/admin/poster.html', '_blank');

// ── Lost & Found Management ──
// Everything lost & found lives here now, including reports waiting for
// review (they used to be in the Inbox). Tabs: Needs review, On website,
// Expired, Resolved, Rejected. "Map" shows the tab's reports with exact pins.
let _lfManageFilter = null;      // null = pick: Needs review if anything's waiting
let _lfManageData = [];
let _lfMapView = false;

function lfBuckets(all) {
  const monthAgo = new Date(Date.now() - 30*24*60*60*1000).toISOString();
  return {
    review: all.filter(r => r.status === 'pending'),
    active: all.filter(r => r.status === 'approved' && r.created_at >= monthAgo),
    expired: all.filter(r => r.status === 'approved' && r.created_at < monthAgo),
    resolved: all.filter(r => r.status === 'resolved'),
    rejected: all.filter(r => r.status === 'rejected'),
  };
}

async function renderLostFoundManage(el) {
  el.innerHTML = '<h1 class="text-2xl font-display font-bold text-sage-800 mb-6">Lost & Found</h1><p class="text-gray-400">Loading...</p>';
  const reports = await api('/admin/lost-found');
  if (reports.error) { el.innerHTML += '<p class="text-red-500">' + h(reports.error) + '</p>'; return; }

  const all = Array.isArray(reports) ? reports : [];
  _lfManageData = all;
  _lfData = all;
  const b = lfBuckets(all);
  if (!_lfManageFilter || (_lfManageFilter === 'pending')) _lfManageFilter = b.review.length ? 'review' : 'active';

  const tabBtn = (key, label) => {
    const n = b[key].length;
    if (!n && (key === 'expired' || key === 'rejected')) return '';
    const warn = key === 'review' && n ? ' style="border-color:#f59e0b"' : '';
    return `<button onclick="_lfManageFilter='${key}';renderLostFoundManage(document.getElementById('content'))" class="filter-tab ${_lfManageFilter === key ? 'active' : ''}"${warn}>${label} (${n})</button>`;
  };

  let html = `<div class="flex items-center justify-between mb-5 flex-wrap gap-3">
    <h1 class="text-2xl font-display font-bold text-sage-800">Lost & Found</h1>
    <div class="flex items-center gap-3 flex-wrap">
      <button onclick="_lfMapView=!_lfMapView;renderLostFoundManage(document.getElementById('content'))" class="text-xs font-semibold px-4 py-2 rounded-xl border border-sage-200 ${_lfMapView ? 'bg-sage-100 text-sage-800' : 'bg-white text-sage-700'}">${_lfMapView ? 'Hide map' : 'Map'}</button>
      <button onclick="addReport()" class="bg-sage-700 hover:bg-sage-800 text-white font-semibold text-xs px-4 py-2 rounded-xl transition">+ Add Report</button>
      <a href="https://wcahs.org/lost-found.html" target="_blank" class="text-xs text-sage-600 hover:underline font-semibold">View Public Page &rarr;</a>
    </div>

    ${tabBtn('resolved', 'Resolved')}
    ${tabBtn('rejected', 'Rejected')}
  </div>`;

  const items = b[_lfManageFilter] || [];
  if (_lfMapView) {
    const pinned = items.filter(r => r.lat != null).length;
    html += `<div id="lfAdminMap" class="card overflow-hidden mb-2" style="height:380px"></div>
      <p class="text-xs text-gray-400 mb-5">${pinned} of ${items.length} in this tab have a pin. Exact locations — the public map rounds them to about a block and hides house numbers.</p>`;
  }

  const emptyText = { review: 'Nothing waiting for review', active: 'No reports on the website right now',
    expired: 'No expired reports', resolved: 'No resolved reports', rejected: 'No rejected reports' };
  if (items.length === 0) {
    html += `<div class="card p-10 text-center">
      <svg class="w-14 h-14 mx-auto text-sage-200 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
      <p class="text-gray-400 font-semibold">${emptyText[_lfManageFilter]}</p>
    </div>`;
  } else {
    if (_lfManageFilter === 'review') html += '<p class="text-xs text-gray-400 mb-3">Tap a report to see everything and approve it. Approving puts it on the public Lost &amp; Found page and map.</p>';
    html += '<div class="space-y-3">';
    items.forEach(r => {
      let photos = [];
      if (r.photo_url) { try { photos = JSON.parse(r.photo_url); } catch(e) { photos = [r.photo_url]; } }
      const thumbHtml = photos[0]
        ? `<img src="${photos[0]}" class="w-14 h-14 rounded-xl object-cover shrink-0 border border-sage-100">`
        : `<div class="w-14 h-14 rounded-xl bg-sage-50 flex items-center justify-center shrink-0"><svg class="w-6 h-6 text-sage-200" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg></div>`;

// Expand a report card and bring it into view (map pins, deep links).
function openLFCard(id) {
  const body = document.getElementById('lf-' + id);
  const card = document.getElementById('lf-card-' + id);
  if (!body || !card) return;
  body.classList.remove('hidden');
  const arrow = document.getElementById('lf-arrow-' + id);
  if (arrow) arrow.style.transform = 'rotate(180deg)';
  card.classList.add('ring-2', 'ring-sage-400');
  card.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

window.sendBroadcast = async function() {
  const subject = document.getElementById('bcSubject').value.trim();
  const bodyHtml = getQuillHtml('bcBodyEditor');
  const fromName = document.getElementById('bcFromName').value.trim() || 'WCAHS';
  const status = document.getElementById('bcStatus');

  if (!subject || !bodyHtml) { alert('Subject and body are required'); return; }

  if (!confirm('Send this broadcast to all subscribers?\n\nSubject: ' + subject)) return;

  status.textContent = 'Sending...';
  status.className = 'text-sm text-gray-500';
  status.classList.remove('hidden');

  const res = await api('/admin/email/broadcast', { method: 'POST', body: {
    subject, html: bodyHtml, from_name: fromName,
  }});

  if (res.error) {
    status.textContent = 'Error: ' + res.error;
    status.className = 'text-sm text-red-600';
  } else {
    status.textContent = 'Broadcast sent!';
    status.className = 'text-sm font-semibold';
    status.style.color = '#5c6b4e';
    document.getElementById('bcSubject').value = '';
    if (_quillInstances['bcBodyEditor']) _quillInstances['bcBodyEditor'].root.innerHTML = '';
  }
};

function buildTimeOptions(selected) {
  let opts = '<option value="">--</option>';
  for (let h = 0; h < 24; h++) {
    for (let m = 0; m < 60; m += 15) {
      const h12 = h === 0 ? 12 : h > 12 ? h - 12 : h;
      const ampm = h < 12 ? 'AM' : 'PM';
      const label = h12 + ':' + (m < 10 ? '0' : '') + m + ' ' + ampm;
      opts += `<option value="${label}" ${selected===label?'selected':''}>${label}</option>`;
    }
  }
  return opts;
}

      </div>
      <div><label class="block text-xs font-semibold text-gray-600 mb-1">Event Type</label>

// Most events are one day. The end date is greyed out until someone says
// otherwise, so a stale value can't silently make an event span a week.
window.toggleEndDate = function() {
  const on = document.getElementById('evMultiDay').checked;
  const el = document.getElementById('evEndDate');
  el.disabled = !on;
  el.classList.toggle('bg-gray-50', !on);
  el.classList.toggle('text-gray-400', !on);
  if (!on) el.value = '';
  else el.focus();
};

window.showEventForm = function() { document.getElementById('eventFormArea').innerHTML = eventFormHtml(); };
window.editEvent = function(ev) { document.getElementById('eventFormArea').innerHTML = eventFormHtml(ev); window.scrollTo(0,0); };

window.saveEvent = async function(id) {
  const startTime = document.getElementById('evStartTime').value;
  const endTime = document.getElementById('evEndTime').value;
  let time = '';
  if (startTime && endTime) time = startTime + ' – ' + endTime;
  else if (startTime) time = startTime;

  const venue = document.getElementById('evVenue').value.trim();
  const address = document.getElementById('evAddress').value.trim();
  let location = '';
  if (venue && address) location = venue + ', ' + address;
  else location = venue || address;

  const badgeSelect = document.getElementById('evBadgeSelect').value;
  const badgeCustom = document.getElementById('evBadgeCustom').value.trim();
  const badge = badgeSelect === 'custom' ? badgeCustom : badgeSelect;

  const multiDay = document.getElementById('evMultiDay').checked;
  const endDate = multiDay ? document.getElementById('evEndDate').value : '';

  const body = {
    title: document.getElementById('evTitle').value,
    date: document.getElementById('evDate').value,
    end_date: endDate || null,
    time: time,
    location: location,
    description: document.getElementById('evDesc').value,
    badge: badge,
    cta_url: document.getElementById('evCtaUrl').value.trim(),
    cta_label: document.getElementById('evCtaLabel').value.trim(),
    form_key: document.getElementById('evFormKey').value || null,
    color: 'auto',
    published: document.getElementById('evPublished').checked,
  };
  if (!body.title || !body.date) { alert('Title and date are required'); return; }
  if (id) { await api('/admin/events/' + id, { method: 'PUT', body }); }
  else { await api('/admin/events', { method: 'POST', body }); }
  navigate('events');
};

window.deleteEvent = async function(id) {
  await api('/admin/events/' + id, { method: 'DELETE' });
  navigate('events');
};

// Partners list management
let _partners = [];
window.renderPartnersList = function(partners) {
  _partners = partners;
  const el = document.getElementById('partnersList');
  if (!el) return;
  el.innerHTML = partners.map((p, i) =>
    `<div class="flex items-center justify-between bg-sage-50 rounded-xl px-3 py-2">
      <span class="text-sm text-gray-800">${h(p)}</span>
      <button onclick="removePartner(${i})" class="text-red-500 text-xs hover:underline">Remove</button>
    </div>`
  ).join('') || '<p class="text-gray-400 text-xs">No partners added</p>';
};
window.addPartner = function() {
  const input = document.getElementById('newPartner');
  const val = input.value.trim();
  if (!val) return;
  _partners.push(val);
  input.value = '';
  renderPartnersList(_partners);
};
window.removePartner = function(i) {
  _partners.splice(i, 1);
  renderPartnersList(_partners);
};

window.updateAnnCharCount = function() {
  const input = document.getElementById('setAnnText');
  const counter = document.getElementById('annCharCount');
  if (input && counter) {
    counter.textContent = input.value.length;
    counter.style.color = input.value.length > 100 ? '#d97706' : '';
  }
};

window.updateAnnColorPreview = function() {
  const select = document.getElementById('setAnnColor');
  const preview = document.getElementById('annColorPreview');
  const colors = { sage: '#48543e', amber: '#d97706', red: '#dc2626', blue: '#2563eb', dark: '#1f2937' };
  if (select && preview) preview.style.background = colors[select.value] || colors.sage;
};

window.updateAnnPreview = function() {
  const enabled = document.getElementById('setAnnEnabled');
  const text = document.getElementById('setAnnText');
  const color = document.getElementById('setAnnColor');
  const wrap = document.getElementById('annPreview');
  const banner = document.getElementById('annPreviewBanner');
  if (!wrap || !banner) return;
  const colors = { sage: '#48543e', amber: '#d97706', red: '#dc2626', blue: '#2563eb', dark: '#1f2937' };
  if (enabled && enabled.checked) {
    wrap.classList.remove('hidden');
    banner.style.background = colors[color.value] || colors.sage;
    banner.textContent = text.value || 'Your announcement text here...';

window.updatePopupCharCount = function() {
  const input = document.getElementById('setPopupMsg');
  const counter = document.getElementById('popupCharCount');
  if (input && counter) {
    counter.textContent = input.value.length;
    counter.style.color = input.value.length > 180 ? '#d97706' : '';
  }
};

window.selectPopupIcon = function(btn, icon) {
  document.getElementById('setPopupIcon').value = icon;
  document.querySelectorAll('.popup-icon-btn').forEach(b => { b.classList.remove('border-sage-600','bg-sage-50','ring-2','ring-sage-300'); b.classList.add('border-gray-200','bg-white'); });
  btn.classList.remove('border-gray-200','bg-white'); btn.classList.add('border-sage-600','bg-sage-50','ring-2','ring-sage-300');
  updatePopupPreview();
};

window.applyPopupPreset = function(bg, btn, text) {
  document.getElementById('setPopupColorBg').value = bg;
  document.getElementById('setPopupColorBtn').value = btn;
  document.getElementById('setPopupColorText').value = text;
  updatePopupPreview();
};

window.selectPopupFont = function(font) {
  document.querySelectorAll('.popup-font-btn').forEach(b => { b.classList.remove('border-sage-600','bg-sage-50','font-bold'); b.classList.add('border-gray-200','bg-white'); });
  var btn = document.querySelector('.popup-font-btn[data-font="'+font+'"]');
  if (btn) { btn.classList.remove('border-gray-200','bg-white'); btn.classList.add('border-sage-600','bg-sage-50','font-bold'); }
  updatePopupPreview();
};

window.selectBtnShape = function(shape) {
  document.getElementById('setPopupBtnShape').value = shape;
  document.querySelectorAll('.btn-shape-btn').forEach(b => { b.classList.remove('border-sage-600','bg-sage-50'); b.classList.add('border-gray-200','bg-white'); });
  document.querySelector('.btn-shape-btn[data-shape="'+shape+'"]').classList.remove('border-gray-200','bg-white');
  document.querySelector('.btn-shape-btn[data-shape="'+shape+'"]').classList.add('border-sage-600','bg-sage-50');

window.selectBtnVariant = function(variant) {
  document.getElementById('setPopupBtnVariant').value = variant;
  document.querySelectorAll('.btn-var-btn').forEach(b => { b.classList.remove('border-sage-600','bg-sage-50'); b.classList.add('border-gray-200','bg-white'); });
  document.querySelector('.btn-var-btn[data-variant="'+variant+'"]').classList.remove('border-gray-200','bg-white');
  document.querySelector('.btn-var-btn[data-variant="'+variant+'"]').classList.add('border-sage-600','bg-sage-50');
  updatePopupPreview();

window.updatePopupPreview = function() {
  const enabled = document.getElementById('setPopupEnabled');
  const wrap = document.getElementById('popupPreviewWrap');
  const box = document.getElementById('popupPreviewBox');
  const iconEl = document.getElementById('popupPreviewIcon');
  const msgEl = document.getElementById('popupPreviewMsg');
  const btnEl = document.getElementById('popupPreviewBtn');
  const closeEl = document.getElementById('popupPreviewClose');
  if (!wrap || !box) return;

  // Always show preview so they can see what they're building
  wrap.classList.remove('hidden');

  const bg = document.getElementById('setPopupColorBg').value;
  const btn = document.getElementById('setPopupColorBtn').value;
  const text = document.getElementById('setPopupColorText').value;
  // Compute contrasting button text color (white or dark)
  const r = parseInt(btn.slice(1,3),16), g = parseInt(btn.slice(3,5),16), b2 = parseInt(btn.slice(5,7),16);
  const btnTextColor = (r*0.299 + g*0.587 + b2*0.114) > 150 ? '#1c1917' : '#ffffff';
  const st = { btn: btn, bg: bg, text: text, btnText: btnTextColor };
  box.style.background = st.bg;
  msgEl.style.color = st.text;
  if (closeEl) closeEl.style.color = st.text;
  // Update hex labels
  var lbl;
  lbl = document.getElementById('popupColorBgLabel'); if(lbl) lbl.textContent = bg;
  lbl = document.getElementById('popupColorBtnLabel'); if(lbl) lbl.textContent = btn;
  lbl = document.getElementById('popupColorTextLabel'); if(lbl) lbl.textContent = text;
  // Font
  const fonts = { nunito: 'Nunito, sans-serif', playfair: 'Playfair Display, serif', georgia: 'Georgia, serif', system: '-apple-system, BlinkMacSystemFont, sans-serif' };
  const selFont = document.querySelector('.popup-font-btn.border-sage-600');
  const fontVal = selFont ? selFont.dataset.font : 'nunito';
  const fontCss = fonts[fontVal] || fonts.nunito;
  msgEl.style.fontFamily = fontCss;

  const icon = document.getElementById('setPopupIcon').value;
  iconEl.textContent = icon;
  iconEl.style.display = icon ? '' : 'none';

  const msg = document.getElementById('setPopupMsg').value;
  msgEl.textContent = msg || 'Your popup message here...';

  const btnText = document.getElementById('setPopupBtnText').value;
  const shape = document.getElementById('setPopupBtnShape').value;
  const variant = document.getElementById('setPopupBtnVariant').value;
  const radius = shape === 'pill' ? '50px' : '12px';

  if (btnText) {
    const safeText = btnText.replace(/</g,'&lt;');
    let btnStyle = '';
    if (variant === 'filled') {
      btnStyle = 'background:'+st.btn+';color:'+st.btnText+';border:2px solid '+st.btn;
    } else {
      btnStyle = 'background:transparent;color:'+st.btn+';border:2px solid '+st.btn;
    }
    btnEl.innerHTML = '<span style="display:inline-block;'+btnStyle+';padding:10px 28px;border-radius:'+radius+';font-family:Nunito,sans-serif;font-size:0.88rem;font-weight:700;cursor:default;">'+safeText+'</span>';
  } else {
    let dismissStyle = '';
    if (variant === 'filled') {
      dismissStyle = 'background:'+st.btn+';color:'+st.btnText+';border:2px solid '+st.btn;
    } else {
      dismissStyle = 'background:transparent;color:'+st.btn+';border:2px solid '+st.btn;
    }
    btnEl.innerHTML = '<span style="display:inline-block;'+dismissStyle+';padding:8px 24px;border-radius:'+radius+';font-family:Nunito,sans-serif;font-size:0.85rem;font-weight:600;cursor:default;">Dismiss</span>';
  }
};


window.saveSettings = async function() {
  try {
  const body = {
    donation_provider: document.getElementById('setDonationProvider').value,
    donate_url: document.getElementById('setDonate').value,
    zeffy_url: document.getElementById('setZeffy').value,
    wishlist_url: document.getElementById('setWishlist').value,
    partners: _partners,
    announcement_enabled: document.getElementById('setAnnEnabled').checked ? 'true' : 'false',
    announcement_text: document.getElementById('setAnnText').value,
    announcement_pages: 'all',
    announcement_color: document.getElementById('setAnnColor').value,
  };
  // Popup settings
  const popupEl = document.getElementById('setPopupEnabled');
  if (popupEl) {
    body.popup_enabled = popupEl.checked ? 'true' : 'false';
    body.popup_icon = document.getElementById('setPopupIcon').value;
    body.popup_color_bg = document.getElementById('setPopupColorBg').value;
    body.popup_color_btn = document.getElementById('setPopupColorBtn').value;
    body.popup_color_text = document.getElementById('setPopupColorText').value;
    var selFontBtn = document.querySelector('.popup-font-btn.border-sage-600');
    body.popup_font = selFontBtn ? selFontBtn.dataset.font : 'nunito';
    body.popup_message = document.getElementById('setPopupMsg').value;
    body.popup_button_text = document.getElementById('setPopupBtnText').value;
    body.popup_button_link = document.getElementById('setPopupBtnLink').value;
    body.popup_button_shape = document.getElementById('setPopupBtnShape').value;
    body.popup_button_variant = document.getElementById('setPopupBtnVariant').value;
  }
  // Under construction — only save if techadmin
  const ucEl = document.getElementById('setUcEnabled');
  if (ucEl) {
    body.under_construction = ucEl.checked ? 'true' : 'false';
    body.under_construction_pages = 'all';
  }
  const res = await api('/admin/settings', { method: 'PUT', body });
  const saved = document.getElementById('settingsSaved');
  if (res.error) {
    saved.textContent = 'Error: ' + JSON.stringify(res.error);
    saved.style.background = '#fef3c7'; saved.style.color = '#92400e';
  } else {
    saved.textContent = 'Settings saved!';
    saved.style.background = '#e8ebe3'; saved.style.color = '#3b4434';
  }
  saved.style.padding = '6px 14px'; saved.style.borderRadius = '10px';
  saved.classList.remove('hidden');
  setTimeout(() => { saved.classList.add('hidden'); }, 3000);
  } catch(err) {
    const saved = document.getElementById('settingsSaved');
    saved.textContent = 'JS Error: ' + err.message;
    saved.style.background = '#fef3c7'; saved.style.color = '#92400e';
    saved.style.padding = '6px 14px'; saved.style.borderRadius = '10px';
    saved.classList.remove('hidden');
  }
};

async function renderAbout(el) {

// ── Analytics ──
let analyticsRange = '7d';
// ── Activity ──
// Who did what, step by step, from their own browser plus the server's login
// log. Built so "it's acting weird" can be looked up instead of guessed at.
let _actUser = '';
let _actProblems = false;

function actDevice(ua) {
  ua = ua || '';
  const dev = /iPhone/.test(ua) ? 'iPhone' : /iPad/.test(ua) ? 'iPad' : /Android/.test(ua) ? 'Android'
    : /Macintosh/.test(ua) ? 'Mac' : /Windows/.test(ua) ? 'Windows' : /Linux/.test(ua) ? 'Linux' : '?';
  const br = /Zoho/i.test(ua) ? 'Zoho app' : /FBAN|FBAV/.test(ua) ? 'Facebook app' : /CriOS|Chrome\//.test(ua) ? 'Chrome'
    : /FxiOS|Firefox/.test(ua) ? 'Firefox' : /EdgiOS|Edg\//.test(ua) ? 'Edge'
    : /Safari\//.test(ua) ? 'Safari' : /AppleWebKit/.test(ua) ? 'in-app browser' : '';
  return dev + (br ? ' · ' + br : '');
}

function actDescribe(r) {
  let d = {};
  try { d = JSON.parse(r.detail || '{}') || {}; } catch (e) {}
  const ms = d.ms != null ? ` (${(d.ms / 1000).toFixed(1)}s)` : '';
  const bad = (text) => ({ text, bad: true });
  const ok = (text) => ({ text, bad: false });
  switch (r.event) {
    case 'page_load': return ok('Opened the admin' + (d.hash ? ` from a link (${d.hash})` : '') + (d.standalone ? ' — home-screen app' : '') + (d.referrer ? ` — came from ${d.referrer}` : ''));
    case 'auth_check': return d.result === 'signed_in' ? ok('Already signed in' + ms) : d.result === 'signed_out' ? ok('Not signed in — login form shown' + ms) : bad('Sign-in check failed: ' + (d.msg || '') + ms);
    case 'turnstile': return d.state === 'token' ? ok('CAPTCHA passed') : d.state === 'slow' ? bad('CAPTCHA still spinning after 10 seconds' + (d.loaded ? '' : ' — Cloudflare script never loaded')) : bad('CAPTCHA ' + d.state + (d.code ? ' (code ' + d.code + ')' : ''));
    case 'login': return d.ok ? ok('Logged in') : bad('Login failed: ' + (d.error || 'unknown') + (d.had_token === false ? ' — no CAPTCHA token yet' : ''));
    case 'login_server': {
      const map = { ok: 'Server: login accepted', no_such_user: 'Server: no such username', bad_password: 'Server: wrong password',
        captcha_missing: 'Server: no CAPTCHA token sent', captcha_failed: 'Server: CAPTCHA rejected', malformed: 'Server: username or password empty' };
      return d.outcome === 'ok' ? ok(map.ok) : bad(map[d.outcome] || ('Server: ' + d.outcome));
    }
    case 'nav': return ok('Went to ' + d.page);
    case 'deep_link': {
      if (d.outcome === 'timeout') return bad('Link target never appeared on the page (' + d.target + ')');
      if (d.outcome === 'deleted') return bad('Email link: report #' + d.id + ' no longer exists');
      if (d.outcome === 'not_permitted') return bad('Link points somewhere their role can\'t open (' + d.hash + ')');
      return ok('Email link: report #' + d.id + ' is ' + d.outcome);
    }
    case 'report_action': return d.ok ? ok('Report #' + d.id + ' → ' + d.status) : bad('Report #' + d.id + ' → ' + d.status + ' FAILED: ' + d.error);
    case 'toast': return { text: 'Was shown: “' + d.message + '”', bad: d.tone === 'error' };
    case 'session_expired': return bad('Session expired while loading ' + d.path + ' — sent back to login');
    case 'js_error': return bad('Page error: ' + d.msg + (d.src ? ' @ ' + d.src : ''));
  }
  return ok(r.event);
}

async function renderActivity(el) {
  el.innerHTML = '<h1 class="text-2xl font-display font-bold text-sage-800 mb-6">Activity</h1><p class="text-gray-400">Loading...</p>';
  const q = new URLSearchParams();
  if (_actUser) q.set('user', _actUser);
  if (_actProblems) q.set('problems', '1');
  const res = await api('/admin/activity?' + q);
  if (res.error) { el.innerHTML += '<p class="text-red-500">' + h(res.error) + '</p>'; return; }

  let html = `<div class="flex items-center justify-between mb-2 flex-wrap gap-3">
    <h1 class="text-2xl font-display font-bold text-sage-800">Activity</h1>
    <div class="flex items-center gap-3 flex-wrap">
      <select onchange="_actUser=this.value;renderActivity(document.getElementById('content'))" class="border border-gray-200 rounded-xl px-3 py-2 text-sm">
        <option value="">Everyone</option>
        ${res.users.map(u => `<option value="${h(u)}" ${u === _actUser ? 'selected' : ''}>${h(u)}</option>`).join('')}
      </select>
      <label class="text-sm flex items-center gap-1.5"><input type="checkbox" ${_actProblems ? 'checked' : ''} onchange="_actProblems=this.checked;renderActivity(document.getElementById('content'))"> Problems only</label>
      <button onclick="renderActivity(document.getElementById('content'))" class="text-xs text-sage-600 font-semibold hover:underline">Refresh</button>
    </div>
  </div>
  <p class="text-xs text-gray-400 mb-5">What the admin page did on each person's phone or computer, newest first. Kept 30 days. Picking a person also shows signed-out visits from the same internet connection.</p>`;

  if (!res.rows.length) {
    html += '<div class="card p-10 text-center text-gray-400 font-semibold">Nothing recorded yet.</div>';
    el.innerHTML = html; return;
  }
  html += '<div class="card divide-y divide-gray-100">';
  let lastVisit = null;
  for (const r of res.rows) {
    const { text, bad } = actDescribe(r);
    const when = new Date(r.at.replace(' ', 'T') + 'Z');
    const newVisit = r.visit && r.visit !== lastVisit;
    if (r.visit) lastVisit = r.visit;
    html += `<div class="px-4 py-2.5 flex gap-3 items-start text-sm ${bad ? 'bg-red-50' : ''} ${newVisit ? 'border-t-2 border-sage-100' : ''}">
      <div class="w-24 md:w-32 shrink-0 text-xs text-gray-400 pt-0.5">${when.toLocaleDateString([], { month: 'short', day: 'numeric' })} ${when.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', second: '2-digit' })}</div>
      <div class="flex-1 min-w-0">
        <div class="${bad ? 'text-red-700 font-semibold' : 'text-gray-700'} break-words">${h(text)}</div>
        <div class="text-[11px] text-gray-400">${h(r.username || 'signed out')} · ${h(actDevice(r.user_agent))}${r.source === 'server' ? ' · server log' : ''}</div>
      </div>
    </div>`;
  }
  html += '</div>';
  el.innerHTML = html;
}

  const rangeBtn = (val, label) => `<button onclick="analyticsRange='${val}';renderAnalytics(document.getElementById('content'))" class="filter-tab ${analyticsRange === val ? 'active' : ''}">${label}</button>`;

  // Bar chart with adaptive sizing
  const dates = data.byDate || [];
  const maxCount = Math.max(...dates.map(d => d.count), 1);
  const numBars = dates.length;

  let barsHtml = '';
  if (numBars === 0) {
    barsHtml = `<div class="flex items-center justify-center h-full w-full">
      <div class="text-center">
        <svg class="w-12 h-12 mx-auto text-sage-200 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
        <p class="text-gray-400 text-xs">No data for this period</p>
      </div>
    </div>`;
  } else {
    // Adaptive: wider bars for few data points, thinner for many
    const barGap = numBars <= 7 ? '6px' : numBars <= 14 ? '3px' : '2px';
    const minBarWidth = numBars <= 7 ? '36px' : numBars <= 14 ? '20px' : '8px';
    // Label skip: show every Nth label to avoid overlap
    const labelSkip = numBars <= 7 ? 1 : numBars <= 14 ? 2 : numBars <= 21 ? 3 : Math.ceil(numBars / 8);

    barsHtml = `<div class="flex items-end justify-center w-full h-full" style="gap:${barGap}">`;
    dates.forEach((d, i) => {
      const heightPct = Math.max((d.count / maxCount) * 100, 4); // min 4% so 0-count bars visible
      const heightPx = Math.max(Math.round(heightPct * 1.2), 4);
      // d.date is UTC date like "2026-06-23" — parse at noon local to avoid day shift
      const label = new Date(d.date + 'T12:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
      const isToday = d.date === new Date().toLocaleDateString('en-CA'); // en-CA gives YYYY-MM-DD
      const showLabel = (i % labelSkip === 0) || i === numBars - 1;
      barsHtml += `<div class="chart-bar flex flex-col items-center gap-1 relative" style="flex:1;min-width:${minBarWidth};max-width:60px">
        <div class="chart-bar-tooltip">${d.count} view${d.count!==1?'s':''}</div>

  // Table builder
  const table = (rows) => rows.length === 0 ? '<p class="text-gray-400 text-xs">No data yet</p>' :
    rows.map((r, i) => {

          <div class="w-full bg-gray-100 rounded-full h-1"><div class="bg-sage-500 h-1 rounded-full" style="width:${pct}%"></div></div>
        </div>
      </div>`;
    }).join('');

  el.innerHTML = `<div class="flex items-center justify-between mb-6 flex-wrap gap-3">
    <h1 class="text-2xl font-display font-bold text-sage-800">Analytics</h1>
    <div class="flex gap-2">${rangeBtn('24h', '24h')}${rangeBtn('7d', '7 days')}${rangeBtn('30d', '30 days')}</div>
  </div>

  <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-5">
    <div class="card p-4 text-center">
      <p class="text-2xl font-bold text-sage-700">${data.totalViews.toLocaleString()}</p>
      <p class="text-gray-400 text-xs mt-0.5">Page Views</p>
    </div>
    <div class="card p-4 text-center">
      <p class="text-2xl font-bold text-sage-700">${data.totalVisits.toLocaleString()}</p>
      <p class="text-gray-400 text-xs mt-0.5">Visits</p>
    </div>
    <div class="card p-4 text-center">
      <p class="text-2xl font-bold text-sage-700">${data.topPages.length}</p>

    </div>
    <div class="card p-4 text-center">
      <p class="text-2xl font-bold text-sage-700">${data.topCountries.length}</p>
      <p class="text-gray-400 text-xs mt-0.5">Countries</p>
    </div>
  </div>

  <div class="card p-6 mb-5">
    <h3 class="font-bold text-gray-900 text-sm mb-4">Page Views Over Time</h3>
    <div style="height:140px">${barsHtml}</div>
  </div>

  <div class="grid md:grid-cols-2 gap-5 mb-5">

  <div class="grid md:grid-cols-2 gap-5 mb-5">

  <div class="grid md:grid-cols-2 gap-5">

  <p class="text-xs text-gray-400 mt-4 text-center">Powered by Cloudflare Web Analytics &bull; UTC: ${new Date().toLocaleString('en-US', { timeZone: 'UTC', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit', hour12: true })}</p>`;

  // Load email stats async (don't block analytics render)

// Mirrors isPublishable() in functions/api/pets.js — an ALLOWLIST, not a list
// of bad statuses. These two used to disagree: the public API hid anything that
// wasn't "Available *", while admin only hid a fixed list, so a pet with a
// status nobody had thought of (e.g. "Healthy in Home") sat in the Active tab
// claiming to be on the website while the site correctly hid it. Any new or
// renamed ShelterLuv status now lands in Not on Site in both places.
function isPublishableStatus(status) {
  if (!status) return false;
  return /^available\b/i.test(String(status).trim());
}
function isOnSite(pet) { return !!pet.is_manual || isPublishableStatus(pet.status); }

function petCard(pet, showActions) {
  const isHidden = pet.hidden === 1;
  const isInactive = !isOnSite(pet);
  const photoUrl = pet.cover_photo || '';
  const photoHtml = photoUrl
    ? `<img src="${h(photoUrl)}" class="w-full h-48 sm:h-52 object-cover rounded-t-2xl" onerror="this.style.display='none'">`

  const statusColor = isHidden ? 'bg-gray-100 text-gray-500'
    : isInactive ? 'bg-amber-50 text-amber-700'
    : 'bg-sage-100 text-sage-700';

  let actions = '';
  if (showActions) {
    actions = '<div class="flex flex-wrap gap-2 mt-3 pt-3 border-t border-sage-100">';
    if (isInactive && !pet.is_manual) {
      actions += `<button onclick="moveToHappyTails('${h(pet.id)}','${h(pet.name)}','${h(pet.type||'')}','${h(pet.breed||'')}','${h(pet.cover_photo||'')}')" class="text-xs bg-amber-500 text-white px-3 py-1.5 rounded-lg hover:bg-amber-600 transition font-semibold">Happy Tails</button>`;
      if (!isHidden) {
        actions += `<button onclick="dismissInactivePet('${h(pet.id)}')" class="text-xs bg-gray-100 text-gray-600 px-3 py-1.5 rounded-lg hover:bg-gray-200 transition font-semibold">Dismiss</button>`;
      } else {
        actions += `<button onclick="togglePetVisibility('${h(pet.id)}', false)" class="text-xs bg-sage-600 text-white px-3 py-1.5 rounded-lg hover:bg-sage-700 transition font-semibold">Restore</button>`;
      }
    }
    if (!isInactive && isHidden) {
      actions += `<button onclick="togglePetVisibility('${h(pet.id)}', false)" class="text-xs bg-sage-600 text-white px-3 py-1.5 rounded-lg hover:bg-sage-700 transition font-semibold">Show</button>`;
    } else if (!isInactive && !isHidden) {

      actions += `<button onclick="if(confirm('Delete this pet?')) deleteManualPet('${h(pet.id)}')" class="text-xs text-red-400 hover:underline ml-auto">Delete</button>`;
    }
    // Only offered when ShelterLuv flags the pet as Bonded — that attribute says a
    // pair exists but never who with, which is the gap this fills.
    const petAttrs = Array.isArray(pet.attributes) ? pet.attributes
                   : (() => { try { return JSON.parse(pet.attributes || '[]'); } catch (e) { return []; } })();
    if (petAttrs.indexOf('Bonded') !== -1) {
      const partner = (window._bondedPairs || {})[String(pet.id)];
      actions += `<button onclick="showBondedPicker('${h(pet.id)}','${h(pet.name)}')" class="text-xs ${partner ? 'bg-amber-200 text-amber-900' : 'bg-amber-100 text-amber-700'} px-3 py-1.5 rounded-lg hover:bg-amber-200 transition font-semibold">${partner ? 'Bonded with ' + h(partner.partner_name || '?') : 'Set bonded pair'}</button>`;
    }
    if (currentRole === 'admin') {
      const fosterNames = pet.foster_names || [];
      if (fosterNames.length > 0) {
        actions += `<button onclick="showAssignFoster('${h(pet.id)}','${h(pet.name)}')" class="text-xs bg-sage-100 text-sage-700 px-3 py-1.5 rounded-lg hover:bg-sage-200 transition font-semibold ml-auto">Foster: ${h(fosterNames.join(', '))}</button>`;
