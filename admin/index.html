    <div class="p-3">
      <div class="flex items-center justify-between mb-0.5">
        <h3 class="font-bold text-gray-900 text-sm cursor-pointer hover:text-sage-700" onclick="togglePetDetail('${pet.id}')">${h(pet.name)}</h3>
        <div class="flex gap-1">
          ${fosterNames.length > 0 ? '<span class="text-[10px] px-1.5 py-0.5 rounded-full bg-sage-100 text-sage-700 font-semibold">Fostered</span>' : ''}
          ${pet.is_manual ? '<span class="text-[10px] px-1.5 py-0.5 rounded-full bg-blue-50 text-blue-600 font-semibold">Manual</span>' : ''}
        </div>
      </div>
      <p class="text-xs text-gray-500">${h(pet.type || '')}${pet.breed ? ' &bull; ' + h(pet.breed) : ''}</p>
      <p class="text-[11px] text-gray-400">${h(pet.age_display || '')}${pet.sex ? ' &bull; ' + h(pet.sex) : ''}</p>
      <p class="text-[11px] mt-1"><span class="inline-block px-2 py-0.5 rounded-full ${statusColor} font-semibold">${isHidden ? 'Hidden' : h(pet.status || 'Available')}</span></p>
      <div id="${detailId}" class="hidden mt-3 pt-3 border-t border-sage-100 text-xs space-y-1 text-gray-500">
        ${pet.color ? '<p><span class="text-gray-400">Color:</span> ' + h(pet.color) + '</p>' : ''}
        ${pet.pattern ? '<p><span class="text-gray-400">Pattern:</span> ' + h(pet.pattern) + '</p>' : ''}
        ${pet.size ? '<p><span class="text-gray-400">Size:</span> ' + h(pet.size) + '</p>' : ''}
        ${pet.weight ? '<p><span class="text-gray-400">Weight:</span> ' + h(pet.weight) + ' lbs</p>' : ''}
        ${pet.dob ? '<p><span class="text-gray-400">DOB:</span> ' + new Date(pet.dob).toLocaleDateString() + '</p>' : ''}
        ${pet.altered ? '<p><span class="text-gray-400">Altered:</span> ' + h(pet.altered) + '</p>' : ''}
        ${pet.microchipped ? '<p><span class="text-gray-400">Microchipped:</span> Yes</p>' : ''}
        ${pet.adoption_fee != null ? '<p><span class="text-gray-400">Fee:</span> $' + pet.adoption_fee + (pet.adoption_fee_name ? ' (' + h(pet.adoption_fee_name) + ')' : '') + '</p>' : ''}
        ${pet.in_foster ? '<p><span class="text-gray-400">In Foster:</span> Yes' + (pet.foster_name ? ' (' + h(pet.foster_name) + ')' : '') + '</p>' : ''}
        ${pet.campus ? '<p><span class="text-gray-400">Campus:</span> ' + h(pet.campus) + '</p>' : ''}
        ${pet.location ? '<p><span class="text-gray-400">Location:</span> ' + h(pet.location) + (pet.location_tier2 ? ' &rarr; ' + h(pet.location_tier2) : '') + '</p>' : ''}
        ${pet.intake_date ? '<p><span class="text-gray-400">Intake:</span> ' + new Date(pet.intake_date).toLocaleDateString() + '</p>' : ''}
        ${pet.litter_group_id ? '<p><span class="text-gray-400">Litter Group:</span> ' + h(pet.litter_group_id) + '</p>' : ''}
        ${pet.description ? '<p class="mt-2 text-gray-600">' + h(pet.description) + '</p>' : ''}
        ${(pet.attributes || []).length > 0 ? '<div class="flex flex-wrap gap-1 mt-2">' + pet.attributes.map(a => '<span class="px-1.5 py-0.5 bg-sage-50 text-sage-600 rounded text-[10px]">' + h(a) + '</span>').join('') + '</div>' : ''}

async function renderPetsActive() {

      container.innerHTML = `<div class="card p-10 text-center">
        <svg class="w-14 h-14 mx-auto text-sage-200 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 19c-4.3 0-7.5-3.2-7.5-7S7.7 5 12 5s7.5 3.2 7.5 7-3.2 7-7.5 7zm-2-9a1 1 0 100-2 1 1 0 000 2zm4 0a1 1 0 100-2 1 1 0 000 2zm-5 3s1.5 2 3 2 3-2 3-2"/></svg>

        <p class="text-gray-300 text-sm mt-1">Active pets from ShelterLuv or manually added will appear here</p>
      </div>`;
      return;
    }

    html += '<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">';

async function renderPetsInactive() {
  const container = document.getElementById('petsContent');
  try {
    const data = await api('/admin/pets');
    const animals = data.animals || [];
    // Filter inactive: not manual, inactive status, not hidden
    const allInactive = animals.filter(a => !isOnSite(a));
    const inactive = allInactive.filter(a => !a.hidden);
    const dismissed = allInactive.filter(a => a.hidden);

    // Auto-hide inactive pets older than 30 days (based on last_updated)
    const thirtyDaysAgo = Date.now() - 30 * 24 * 60 * 60 * 1000;
    const autoHide = inactive.filter(a => {
      if (!a.last_updated) return false;
      const updated = new Date(a.last_updated.replace(' ', 'T') + 'Z');
      return updated.getTime() < thirtyDaysAgo;
    });
    // Auto-dismiss old ones silently
    autoHide.forEach(a => {
      api('/admin/pets', { method: 'PUT', body: { id: a.id, hidden: true } });
    });
    const visible = inactive.filter(a => !autoHide.includes(a));

    if (visible.length === 0 && dismissed.length === 0) {
      container.innerHTML = `<div class="card p-10 text-center">
        <p class="text-gray-400 font-semibold">No inactive pets</p>
        <p class="text-gray-300 text-sm mt-1">Pets that are on hold, adopted, or transferred will appear here</p>
      </div>`;
      return;
    }

    let html = '';
    if (visible.length > 0) {
      html += `<p class="text-sm text-gray-500 mb-3"><span class="font-bold text-gray-800">${visible.length}</span> inactive pet${visible.length !== 1 ? 's' : ''} — move to Happy Tails or dismiss</p>`;
      html += '<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">';
      visible.forEach(pet => { html += petCard(pet, true); });
      html += '</div>';
    } else {
      html += '<p class="text-gray-400 text-sm mb-4">No new inactive pets</p>';
    }

    if (dismissed.length > 0) {
      html += `<details class="mt-6"><summary class="text-xs text-gray-400 cursor-pointer hover:text-gray-600">Dismissed (${dismissed.length})</summary>
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3 mt-3">`;
      dismissed.forEach(pet => { html += petCard(pet, true); });
      html += '</div></details>';
    }
    container.innerHTML = html;
  } catch(e) {
    container.innerHTML = '<p class="text-red-500 text-sm">Error loading pets: ' + h(e.message) + '</p>';
  }
}

window.togglePetVisibility = async function(id, hide) {
  await api('/admin/pets', { method: 'PUT', body: { id, hidden: hide } });
  _petsTab === 'inactive' ? renderPetsInactive() : renderPetsActive();
};

window.manualSync = async function() {
  const btn = document.getElementById('syncBtn');
  if (btn) { btn.textContent = 'Triggering...'; btn.disabled = true; }
  try {
    const res = await api('/admin/sync-dispatch', { method: 'POST' });
    if (res.error) {
      if (btn) { btn.textContent = 'Failed'; setTimeout(() => { btn.textContent = 'Sync Now'; btn.disabled = false; }, 3000); }
    } else {
      if (btn) btn.textContent = 'Triggered!';
      // GitHub Action takes ~10-15s, then refresh page to update sync time
      setTimeout(() => {
        if (btn) { btn.textContent = 'Refreshing...'; }
        setTimeout(() => renderPets(document.getElementById('content')), 2000);
      }, 13000);
    }
  } catch(e) {
    if (btn) { btn.textContent = 'Error'; setTimeout(() => { btn.textContent = 'Sync Now'; btn.disabled = false; }, 3000); }
  }
};

window.togglePetDetail = async function(id) {
  const el = document.getElementById('pet-detail-' + id);
  if (!el) return;
  el.classList.toggle('hidden');
  // Load foster updates if expanding
  if (!el.classList.contains('hidden')) {
    const updatesEl = document.getElementById('pet-foster-updates-' + id);
    if (updatesEl && !updatesEl.dataset.loaded) {
      try {
        const data = await api('/admin/pets/assign');
        const assignments = (data.assignments || []).filter(a => a.animal_id === id);
        if (assignments.length > 0) {
          // Fetch foster updates for this animal
          const fData = await api('/admin/foster-pets');
          const pets = fData.pets || [];
          const pet = pets.find(p => p.id === id);
          const updates = pet?.foster_updates || [];
          if (updates.length > 0) {
            updatesEl.innerHTML = '<p class="text-gray-400 text-[10px] uppercase tracking-wider font-bold mt-3 mb-1">Foster Updates</p>' +
              updates.slice(0, 5).map(u => `<div class="py-1.5 border-b border-gray-50">
                <div class="flex justify-between gap-2">
                  <span class="font-semibold text-gray-600">${u.update_type === 'testimonial' ? '⭐ ' : ''}${h(u.content || '').substring(0, 100)}</span>
                  <button onclick="event.stopPropagation();deleteFosterUpdate(${u.id})" title="Remove from the public page" class="text-[10px] text-red-400 hover:text-red-600 hover:underline shrink-0">Remove</button>
                </div>
                ${u.photo_url ? '<img src="' + h(u.photo_url) + '" class="w-20 h-20 object-cover rounded-lg mt-1 border border-sage-100">' : ''}
                <span class="text-[10px] text-gray-300">${localTime(u.created_at)}</span>
              </div>`).join('');
          }
        }
      } catch(e) {}
      updatesEl.dataset.loaded = 'true';
    }
  }
};

window.submitHappyTailTransition = async function(id, name, type, breed, origPhotoUrl) {
  const date = document.getElementById('htmDate').value;
  if (!date) { alert('Adoption date is required'); return; }
  const family = document.getElementById('htmFamily').value.trim();
  const note = document.getElementById('htmNote').value.trim();

  let familyPhotoUrl = '';
  const photoInput = document.getElementById('htmPhoto');
  if (photoInput.files[0]) {
    familyPhotoUrl = await uploadPhotoFile(photoInput);
  }

  // Build description with family name and note
  let desc = '';
  if (family) desc += family;
  if (note) desc += (desc ? ' — ' : '') + note;

  await api('/admin/pets/happy-tails', { method: 'POST', body: {
    pet_name: name, pet_type: type, breed: breed, photo_url: origPhotoUrl,
    family_photo_url: familyPhotoUrl,
    adoption_date: date, description: desc || ''
  }});

  // Also dismiss the pet from inactive
  await api('/admin/pets', { method: 'PUT', body: { id, hidden: true } });

  document.getElementById('happyTailsOverlay').remove();
  _petsTab = 'happy-tails';
  renderPets(document.getElementById('content'));
};

async function uploadPhotoFile(fileInput) {
  const file = fileInput.files[0];
  if (!file) return '';
  const formData = new FormData();
  formData.append('photo', file);
  const res = await fetch('/api/admin/pets/photo', {
    method: 'POST',
    body: formData,
  });
  const data = await res.json();
  return data.url || '';
}

window.saveHappyTail = async function() {
  const name = document.getElementById('htName').value.trim();

  let photoUrl = '';

  const photoInput = document.getElementById('htPhoto');
  const familyInput = document.getElementById('htFamilyPhoto');
  if (photoInput.files[0]) photoUrl = await uploadPhotoFile(photoInput);
  if (familyInput.files[0]) familyPhotoUrl = await uploadPhotoFile(familyInput);

  const res = await api('/admin/pets/happy-tails', { method: 'POST', body: {
    pet_name: name,
    pet_type: document.getElementById('htType').value,
    breed: document.getElementById('htBreed').value,
    adoption_date: document.getElementById('htDate').value,
    description: document.getElementById('htDesc').value,
    photo_url: photoUrl,
    family_photo_url: familyPhotoUrl,

window.removeHappyTail = async function(id) {

window.uploadHappyTailPhoto = async function(id) {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.onchange = async function() {
    if (!input.files[0]) return;
    const url = await uploadPhotoFile(input);
    if (!url) { alert('Upload failed'); return; }
    // Fetch current entry, update family_photo_url via raw SQL through happy-tails endpoint
    // We need a PUT-like operation. For simplicity, delete and re-add is bad. Let's use a separate approach.
    // Actually, we can just update via a POST with special flag or use the existing endpoints.
    // The happy-tails endpoint only has GET/POST/DELETE. Let's do a direct fetch to update.
    const res = await fetch('/api/admin/pets/happy-tails', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ _update_photo: true, id, family_photo_url: url }),
    });
    _petsTab = 'happy-tails';
    renderPets(document.getElementById('content'));
  };
  input.click();
};

/* Testimonials and photos are live on the public pet page the moment they're

window.deleteFosterUpdate = async function(id) {

  const res = await api('/admin/foster-pets?id=' + encodeURIComponent(id), { method: 'DELETE' });

window.showFosterNoteForm = function(animalId, updateType) {
  const existing = (window._fosterTestimonials || {})[String(animalId)] || '';
  // Find the form container for this pet
  const containers = document.querySelectorAll('[id^="fosterForm_"]');
  containers.forEach(c => c.innerHTML = '');

  // Find the right container by matching animal_id in the buttons near it
  const btns = document.querySelectorAll(`button[onclick*="'${animalId}'"]`);
  let formContainer = null;
  btns.forEach(btn => {
    const sibling = btn.parentElement.nextElementSibling;
    if (sibling && sibling.id && sibling.id.startsWith('fosterForm_')) {
      formContainer = sibling;
    }
  });
  if (!formContainer) return;

  // There is only ever one testimonial per pet, so saving replaces the current
  // one. Pre-fill it, otherwise it looks like you are adding a second.
  const prior = existing ? String(existing) : '';
  const label = updateType === 'testimonial'
    ? (prior ? 'Edit the testimonial (replaces the current one)' : 'Write your testimonial')
    : 'Add a note';
  const btnLabel = updateType === 'testimonial' ? (prior ? 'Update Testimonial' : 'Save Testimonial') : 'Save Note';
  const accentClass = updateType === 'testimonial' ? 'bg-amber-500 hover:bg-amber-600' : 'bg-sage-700 hover:bg-sage-800';

  formContainer.innerHTML = `<div class="card-warm p-4 mt-3 border border-sage-200" style="background:#f6f7f4;">
    <label class="block text-xs font-semibold text-gray-600 mb-1">${label}</label>
    <textarea id="fosterNoteText" rows="3" class="w-full border border-sage-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-sage-400" placeholder="${updateType === 'testimonial' ? 'Share your experience fostering this pet...' : 'How is the pet doing today?'}">${prior ? h(prior) : ''}</textarea>
    <div class="flex gap-2 mt-2">
      <button onclick="submitFosterNote('${animalId}','${updateType}')" class="${accentClass} text-white font-semibold text-sm px-4 py-2 rounded-xl transition">${btnLabel}</button>
      <button onclick="this.closest('[id^=fosterForm_]').innerHTML=''" class="text-gray-500 text-sm px-3 py-2 hover:text-gray-700 transition">Cancel</button>
    </div>
  </div>`;
  document.getElementById('fosterNoteText').focus();
};

window.submitFosterNote = async function(animalId, updateType) {
  const content = document.getElementById('fosterNoteText').value.trim();
  if (!content) { alert('Please write something'); return; }

window.showFosterPhotoUpload = function(animalId) {

  input.type = 'file';

    if (!input.files[0]) return;

    const caption = prompt('Add a caption (optional):') || '';
    const res = await api('/admin/foster-pets', { method: 'POST', body: {

window.changeMyPassword = async function() {
  const current = document.getElementById('cpCurrent').value;
  const newPass = document.getElementById('cpNew').value;
  const confirm = document.getElementById('cpConfirm').value;
  const status = document.getElementById('cpStatus');

  if (!current || !newPass) { status.className = 'text-sm text-red-600'; status.textContent = 'All fields required'; status.classList.remove('hidden'); return; }
  if (newPass !== confirm) { status.className = 'text-sm text-red-600'; status.textContent = 'New passwords don\'t match'; status.classList.remove('hidden'); return; }

  const res = await api('/admin/change-password', { method: 'POST', body: { current_password: current, new_password: newPass } });
  if (res.ok) {
    status.className = 'text-sm text-sage-700'; status.textContent = res.message || 'Password changed!';
    document.getElementById('cpCurrent').value = '';
    document.getElementById('cpNew').value = '';
    document.getElementById('cpConfirm').value = '';
  } else {
    status.className = 'text-sm text-red-600'; status.textContent = res.error || 'Failed';
  }
  status.classList.remove('hidden');
};

// ── Event Forms ──────────────────────────────────────────────────────────
// An event can have a registration form attached to it. This screen is the
// index of those events; opening one shows its applications, its capacity and
// its own open/closed switch. Running another clinic next year means creating
// an event and turning its form on — not touching code.
const FORM_TYPES = { clinic: 'Spay/Neuter Clinic Application' };

// Four statuses, not five. "Overflow" used to be its own tab, but it was never
// a different kind of application — just an applied one that arrived after the
// spots filled. It's a badge on the card now (waitlisted), so staff work one
// queue and can still see at a glance who is waiting on a cancellation.
const CLINIC_STATUSES = ['applied', 'approved', 'ineligible', 'cancelled'];
const CLINIC_STATUS_STYLE = {
  applied:    'bg-amber-100 text-amber-700',
  approved:   'bg-green-100 text-green-700',
  ineligible: 'bg-gray-200 text-gray-600',
  cancelled:  'bg-gray-100 text-gray-400'
};

// A coloured, bordered select reads as something you act on; the plain one
// looked like a label. Staff were not clicking it.
const STATUS_SELECT_STYLE = {
  applied:    'border-amber-400 text-amber-700',
  approved:   'border-green-500 text-green-700',
  ineligible: 'border-gray-400 text-gray-600',
  cancelled:  'border-gray-300 text-gray-400'
};

const INCOME_LABEL = {
  yes: 'Meets MNSNAP guidelines',
  no: 'Does not meet them',
  unsure: 'Not sure'
};

function petAge(p) {
  const parts = [];
  if (p.age_years !== '' && p.age_years != null) parts.push(p.age_years + 'y');
  if (p.age_months !== '' && p.age_months != null) parts.push(p.age_months + 'm');
  return parts.join(' ');
}

let _formEvents = [];
let _formSummary = {};
let _formEventId = null;      // null = show the index
let _clinicData = [];
let _clinicEvent = null;
let _formStates = {};
let _defaultMailboxes = ['info@wcahs.org', 'admin@wcahs.org'];
let _clinicFilter = 'all';

// Every form the site collects, in one place. Three of them are plain site
// forms whose submissions land in the Inbox; the clinic belongs to an event and
// carries its own capacity, open/closed state and roster. Splitting them across
// two screens meant nobody could guess where to look.
const SITE_FORMS = [
  { key: 'contact',    label: 'Contact messages',     where: 'contact.html', type: 'contact' },
  { key: 'foster',     label: 'Foster applications',  where: 'contact.html#foster', type: 'foster' },
  { key: 'lost_found', label: 'Lost & Found reports', where: 'lost-found.html#report', type: 'lost_found' },
];
let _siteNotify = {};
let _siteCounts = {};

async function renderClinic(el) {
  el.innerHTML = '<h1 class="text-2xl font-display font-bold text-sage-800 mb-6">Forms</h1><p class="text-gray-400">Loading...</p>';
  const path = '/admin/clinic' + (_formEventId ? '?event_id=' + _formEventId : '');

  const [data, settings, subs, lf] = await Promise.all([
    api(path),
    api('/admin/settings').catch(() => ({})),
    _formEventId ? Promise.resolve(null) : api('/admin/submissions').catch(() => []),
    _formEventId ? Promise.resolve(null) : api('/admin/lost-found').catch(() => []),
  ]);

  if (data.error) { el.innerHTML += '<p class="text-red-500">' + data.error + '</p>'; return; }

  _formEvents = data.events || [];
  _formSummary = data.summary || {};
  _clinicData = data.registrations || [];
  _formStates = data.form_states || {};
  if (Array.isArray(data.default_mailboxes) && data.default_mailboxes.length) _defaultMailboxes = data.default_mailboxes;

  try {
    _siteNotify = typeof settings.notify_recipients === 'string'
      ? JSON.parse(settings.notify_recipients) : (settings.notify_recipients || {});
  } catch (e) { _siteNotify = {}; }

  if (Array.isArray(subs)) {
    _siteCounts.contact = subs.filter(x => x.type === 'contact').length;
    _siteCounts.foster = subs.filter(x => x.type === 'foster').length;
    _siteCounts.contact_unread = subs.filter(x => x.type === 'contact' && !x.is_read).length;
    _siteCounts.foster_unread = subs.filter(x => x.type === 'foster' && !x.is_read).length;
  }
  if (Array.isArray(lf)) {
    _siteCounts.lost_found = lf.length;
    _siteCounts.lost_found_unread = lf.filter(x => x.status === 'pending').length;
  }

  _clinicEvent = _formEventId ? _formEvents.find(e => e.id === Number(_formEventId)) : null;
  if (_formEventId && !_clinicEvent) { _formEventId = null; }
  if (_formEventId) paintFormEvent(el); else paintFormIndex(el);
}

window.openFormEvent = function(id) { _formEventId = id; _clinicFilter = 'all'; renderClinic(document.getElementById('content')); };
window.backToFormIndex = function() { _formEventId = null; renderClinic(document.getElementById('content')); };

// Every form card shows who it notifies, in the same shape. Event forms and
// site forms are the same kind of thing to whoever is looking at this screen.
function notifyBlock(inputId, savedList, saveCall) {
  const saved = Array.isArray(savedList) && savedList.length ? savedList : null;
  const recipients = saved || _defaultMailboxes;
  const custom = !!saved && (
    saved.length !== _defaultMailboxes.length ||
    saved.some(a => !_defaultMailboxes.includes(a))
  );
  return `<div class="mt-4 pt-3 border-t border-gray-100">
    <div class="flex flex-wrap items-baseline justify-between gap-2 mb-2">
      <p class="text-xs font-bold uppercase tracking-wider text-sage-400">Who gets notified</p>
      <p class="text-xs text-gray-400">${custom ? 'set for this form' : 'using the shelter default'}</p>
    </div>
    <div class="flex flex-wrap gap-2">
      <input id="${inputId}" value="${h(custom ? saved.join(', ') : '')}" placeholder="${h(_defaultMailboxes.join(', '))}" class="flex-1 min-w-[240px] border border-sage-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-sage-400">
      <button onclick="${saveCall}" class="bg-white border border-sage-200 text-sage-700 hover:bg-sage-50 font-semibold text-sm px-4 py-2 rounded-xl transition">Save</button>
    </div>
    <p class="text-xs text-gray-400 mt-2">Currently: ${recipients.map(h).join(', ')}. Separate several with commas; blank uses the shelter's usual mailboxes.</p>
  </div>`;
}

function eventNotifyList(ev) {
  try {
    const a = JSON.parse((ev && ev.notify_emails) || 'null');
    return (Array.isArray(a) && a.length) ? a : null;
  } catch (e) { return null; }
}

function siteFormCard(f) {
  const saved = Array.isArray(_siteNotify[f.key]) && _siteNotify[f.key].length ? _siteNotify[f.key] : null;
  const total = _siteCounts[f.key];
  const unread = _siteCounts[f.key + '_unread'];
  return `<div class="card p-5">
    <div class="flex flex-wrap items-start justify-between gap-3">
      <div>
        <span class="font-bold text-gray-900">${f.label}</span>
        <span class="text-xs px-2 py-0.5 rounded-full bg-sage-100 text-sage-700 ml-2">site form</span>
        <p class="text-sm text-gray-500 mt-1">Always on &bull; wcahs.org/${h(f.where)}</p>
      </div>
      <div class="flex flex-wrap gap-2">
        <a href="/${h(f.where)}" target="_blank" rel="noopener" class="bg-white border border-sage-200 text-sage-700 hover:bg-sage-50 font-semibold text-sm px-4 py-2.5 rounded-xl transition">Preview form</a>
        <button onclick="navigate('${f.key === 'lost_found' ? 'lost-found' : 'submissions'}')" class="bg-sage-700 hover:bg-sage-800 text-white font-semibold text-sm px-4 py-2.5 rounded-xl transition">
          ${total === undefined ? 'Open' : (f.key === 'lost_found' ? 'Open Lost & Found' : 'Open Inbox')}${total ? ' (' + total + ')' : ''}
        </button>
      </div>
    </div>
    ${unread ? `<p class="text-xs mt-2 inline-block px-2.5 py-1 rounded-lg" style="background:#fef3c7;color:#92400e;">${unread} ${f.key === 'lost_found' ? 'awaiting review' : 'unread'}</p>` : ''}
    ${notifyBlock('siteNotify_' + f.key, saved, `saveSiteNotify('${f.key}', this)`)}
  </div>`;
}

window.saveSiteNotify = async function(key, btn) {
  const raw = document.getElementById('siteNotify_' + key).value;
  const list = raw.split(',').map(a => a.trim()).filter(Boolean);
  const bad = list.find(a => !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(a));
  if (bad) { alert(`"${bad}" doesn't look like an email address.`); return; }
  const next = { ..._siteNotify };
  next[key] = list.length ? list : _defaultMailboxes.slice();
  const res = await api('/admin/settings', { method: 'PUT', body: { notify_recipients: next } });
  if (res.error) { alert(res.error); return; }
  if (btn) btn.textContent = 'Saved';
  await renderClinic(document.getElementById('content'));
};

function paintFormIndex(el) {
  let html = `<h1 class="text-2xl font-display font-bold text-sage-800 mb-1">Forms</h1>
    <p class="text-gray-500 text-sm mb-6">Every form on the website, and who hears about each one.</p>`;

  // Forms attached to an event come first: they're the ones with a deadline.
  html += '<p class="text-xs font-bold uppercase tracking-wider text-sage-400 mb-3">Event forms</p>';
  if (_formEvents.length === 0) {
    html += `<div class="card p-6 text-center mb-8">
      <p class="text-gray-400 text-sm">No event is collecting applications.</p>
      <p class="text-gray-400 text-xs mt-1">Open an event under <a onclick="navigate('events')" class="text-sage-700 hover:underline cursor-pointer font-semibold">Events</a> and set its Registration Form to add one.</p>
    </div>`;
  } else {
    html += '<div class="space-y-3 mb-8">';
    _formEvents.forEach(ev => {
      const sum = _formSummary[ev.id] || { total: 0, by_status: {}, used: { cats: 0, dogs: 0 } };
      const past = new Date(ev.date + 'T23:59:59') < new Date();
      const evState = _formStates[ev.form_state] ? ev.form_state : 'closed';
      const open = evState === 'open';
      html += `<div class="card p-5 ${past ? 'opacity-70' : ''}">
        <div class="flex flex-wrap items-start justify-between gap-3">
          <div>
            <span class="font-bold text-gray-900">${h(FORM_TYPES[ev.form_key] || ev.form_key)}</span>
            <span class="text-xs px-2 py-0.5 rounded-full ml-2 ${open ? 'bg-green-100 text-green-700' : evState === 'reviewing' ? 'bg-blue-100 text-blue-700' : 'bg-amber-100 text-amber-700'}">Applications ${open ? 'open' : evState === 'reviewing' ? 'being reviewed' : 'closed'}</span>
            ${!ev.published ? '<span class="text-xs px-2 py-0.5 rounded-full bg-yellow-100 text-yellow-700 ml-1">Draft</span>' : ''}
            ${past ? '<span class="text-xs px-2 py-0.5 rounded-full bg-gray-100 text-gray-500 ml-1">Past</span>' : ''}
            <p class="text-sm text-gray-500 mt-1">${h(ev.title)} &bull; ${formatDate(ev.date)} &bull; wcahs.org/snap</p>
          </div>
          <div class="flex flex-wrap gap-2">
            <a href="/snap?preview=1" target="_blank" rel="noopener" class="bg-white border border-sage-200 text-sage-700 hover:bg-sage-50 font-semibold text-sm px-4 py-2.5 rounded-xl transition">Preview form</a>
            <button onclick="openFormEvent(${ev.id})" class="bg-sage-700 hover:bg-sage-800 text-white font-semibold text-sm px-4 py-2.5 rounded-xl transition">
              View applications${sum.total ? ' (' + sum.total + ')' : ''}
            </button>
          </div>
        </div>
        <div class="flex flex-wrap gap-2 mt-3">
          ${CLINIC_STATUSES.filter(st => sum.by_status[st]).map(st =>
            `<span class="text-xs px-2 py-1 rounded-lg ${CLINIC_STATUS_STYLE[st]}">${st} ${sum.by_status[st]}</span>`).join('')
            || '<span class="text-xs text-gray-400">No applications yet</span>'}
          ${sum.waitlisted ? `<span class="text-xs px-2 py-1 rounded-lg bg-blue-100 text-blue-700">waitlist ${sum.waitlisted}</span>` : ''}
        </div>
        <p class="text-xs text-gray-400 mt-2">
          Cats ${sum.used.cats}/${ev.cap_cats}${sum.used.cats >= ev.cap_cats ? ' (full)' : ''}
          &nbsp;&bull;&nbsp;
          Dogs ${sum.used.dogs}/${ev.cap_dogs}${sum.used.dogs >= ev.cap_dogs ? ' (full)' : ''}
        </p>
        ${notifyBlock('notifyEvent_' + ev.id, eventNotifyList(ev), `saveEventNotify(${ev.id}, 'notifyEvent_${ev.id}', this)`)}
      </div>`;
    });
    html += '</div>';
  }

  html += '<p class="text-xs font-bold uppercase tracking-wider text-sage-400 mb-3">Site forms</p>';
  html += '<div class="space-y-3">' + SITE_FORMS.map(siteFormCard).join('') + '</div>';

    html += `<div class="card p-5 mt-4" style="border-left:4px solid #d97706">
      <p class="font-bold text-gray-900">${_formSummary.unassigned.total} application(s) not linked to an event</p>
      <p class="text-sm text-gray-500 mt-1">These came in before applications were tied to events. Ask your developer to reassign them.</p>
    </div>`;
  }
  el.innerHTML = html;
}

function capacityBar(key, label, approved, pending, cap) {
  const used = approved + pending;
  const full = used >= cap;
  const pctA = cap > 0 ? Math.min(100, (approved / cap) * 100) : 0;
  const pctP = cap > 0 ? Math.min(100 - pctA, (pending / cap) * 100) : 0;
  return `<div class="card p-4">
    <div class="flex items-center justify-between gap-2 mb-2 flex-wrap">
      <span class="text-xs font-bold uppercase tracking-wider text-sage-400">${label}</span>
      <span id="capView${key}" class="flex items-center gap-2">
        <span class="text-sm font-bold ${full ? 'text-amber-600' : 'text-sage-700'}">${used} / ${cap}${full ? ' &bull; FULL' : ''}</span>
        <button onclick="editCap('${key}')" title="Change the limit" class="text-xs text-gray-400 hover:text-sage-700 transition">Edit</button>
      </span>
      <span id="capEdit${key}" class="hidden items-center gap-1">
        <span class="text-sm font-bold text-sage-700">${used} /</span>
        <input id="capInput${key}" type="number" min="0" value="${cap}" class="w-16 border border-sage-200 rounded-lg px-2 py-1 text-sm focus:outline-none focus:ring-2 focus:ring-sage-400">
        <button onclick="saveCap('${key}')" class="text-xs font-semibold text-sage-700 hover:underline">Save</button>
        <button onclick="cancelCap('${key}')" class="text-xs text-gray-400 hover:text-gray-600">Cancel</button>
      </span>
    </div>
    <div class="w-full h-2.5 rounded-full bg-sage-100 overflow-hidden flex">
      <div style="width:${pctA}%; background:#5c6b4e;" title="${approved} approved"></div>
      <div style="width:${pctP}%; background:#fbbf24;" title="${pending} awaiting a decision"></div>
    </div>
    <div class="flex flex-wrap items-center gap-3 mt-2 text-xs">
      <span class="flex items-center gap-1.5 text-gray-500"><span style="width:9px;height:9px;border-radius:2px;background:#5c6b4e;display:inline-block;"></span>${approved} approved</span>
      <span class="flex items-center gap-1.5 text-gray-500"><span style="width:9px;height:9px;border-radius:2px;background:#fbbf24;display:inline-block;"></span>${pending} pending</span>
      <span class="text-gray-400 ml-auto">${Math.max(0, cap - used)} left</span>
    </div>
  </div>`;
}

window.editCap = function(key) {
  document.getElementById('capView' + key).classList.add('hidden');
  const ed = document.getElementById('capEdit' + key);
  ed.classList.remove('hidden'); ed.classList.add('flex');
  document.getElementById('capInput' + key).focus();
};

window.cancelCap = function(key) {
  const ed = document.getElementById('capEdit' + key);
  ed.classList.add('hidden'); ed.classList.remove('flex');
  document.getElementById('capView' + key).classList.remove('hidden');
};

window.saveCap = async function(key) {
  const n = parseInt(document.getElementById('capInput' + key).value, 10);
  if (isNaN(n) || n < 0) { alert('Spot limit must be zero or higher'); return; }
  const body = { event_id: _formEventId };
  body[key === 'cats' ? 'cap_cats' : 'cap_dogs'] = n;
  const res = await api('/admin/clinic', { method: 'PUT', body });
  if (res.error) { alert(res.error); return; }
  await renderClinic(document.getElementById('content'));
};

  const res = await api('/admin/clinic', { method: 'PUT', body: { event_id: eventId, notify_emails: list } });

window.setWaitlisted = async function(id, waitlisted) {
  const row = _clinicData.find(r => r.id === id);
  if (waitlisted === false && row && _clinicEvent) {
    // Coming off the waiting list means taking a slot, which may not be there.
    const used = (_formSummary[_clinicEvent.id] || { used: { cats: 0, dogs: 0 } }).used;
    const overCats = row.cat_count > 0 && used.cats + row.cat_count > _clinicEvent.cap_cats;
    const overDogs = row.dog_count > 0 && used.dogs + row.dog_count > _clinicEvent.cap_dogs;
    if (overCats || overDogs) {
      const which = [overCats ? 'cat' : null, overDogs ? 'dog' : null].filter(Boolean).join(' and ');
      if (!confirm(`This will put you over the ${which} spot limit.\n\nMove them off the waiting list anyway?`)) return;

  const res = await api('/admin/clinic/' + id, { method: 'PUT', body: { waitlisted } });

// ── MNSNAP intake sheet export ───────────────────────────────────────────
// Reproduces the spreadsheet MNSNAP works from on surgery day, one row per
// ANIMAL, grouped the way they run the schedule: dogs first (9am check-in),
// then cats (9:30am). The slot label in column B is what tells the surgery
// team what they're setting up for, so it's derived from sex + species +
// weight rather than typed.
const DOG_BANDS = [
  { max: 29,  label: 'Small (0-29 lbs)' },
  { max: 49,  label: 'Medium (30-49 lbs)' },
  { max: 70,  label: 'Large (50-70 lbs)' },
  { max: 100, label: 'XLarge (70-100 lbs)' },
  { max: Infinity, label: 'XXLarge (100+ lbs)' }
];

function slotLabel(pet) {
  const sex = pet.sex || 'Unknown sex';
  const species = pet.species || '';
  if (String(species).toLowerCase() === 'cat') return `${sex} Cat`;
  const w = parseInt(pet.weight, 10);
  if (isNaN(w)) return `${sex} Dog (weight not given)`;
  const band = DOG_BANDS.find(b => w <= b.max);
  return `${sex} Dog ${band.label}`;
}

// Dogs before cats, then male before female, then lightest first — so the
// sheet reads in the order the day actually runs.
function slotSort(a, b) {
  const sp = x => String(x.pet.species || '').toLowerCase() === 'cat' ? 1 : 0;
  if (sp(a) !== sp(b)) return sp(a) - sp(b);
  const sx = x => String(x.pet.sex || '').toLowerCase() === 'female' ? 1 : 0;
  if (sx(a) !== sx(b)) return sx(a) - sx(b);
  const w = x => { const n = parseInt(x.pet.weight, 10); return isNaN(n) ? 9999 : n; };
  if (w(a) !== w(b)) return w(a) - w(b);
  return String(a.reg.owner_last || '').localeCompare(String(b.reg.owner_last || ''));
}

window.exportClinicXlsx = function() {
  if (typeof XLSX === 'undefined') {
    alert('The spreadsheet library did not load. Check your connection and refresh.');
    return;
  }

  // Approved only — this sheet goes to MNSNAP as the confirmed day roster.
  const approved = _clinicData.filter(r => r.status === 'approved');
  if (approved.length === 0) {
    alert('No approved applications yet.\n\nSet applications to Approved using the Status dropdown on each one, then export.');
    return;
  }

  // Exporting with undecided applications still sitting there is how someone
  // gets left off the roster by accident. Waitlisted ones are excluded from the
  // count — those are deliberately waiting on a cancellation, not on staff.
  const pending = _clinicData.filter(r => r.status === 'applied' && !r.waitlisted);
  if (pending.length > 0) {
    const sum = _formSummary[_clinicEvent ? _clinicEvent.id : _formEventId] || {};
    const appr = sum.approved || { cats: 0, dogs: 0 };
    const catsLeft = Math.max(0, (_clinicEvent ? _clinicEvent.cap_cats : 0) - appr.cats);
    const dogsLeft = Math.max(0, (_clinicEvent ? _clinicEvent.cap_dogs : 0) - appr.dogs);
    const names = pending.slice(0, 5).map(r => '  \u2022 ' + r.owner_name).join('\n')
      + (pending.length > 5 ? `\n  \u2022 ...and ${pending.length - 5} more` : '');
    const msg =
      `${pending.length} application${pending.length === 1 ? ' is' : 's are'} still awaiting a decision and will NOT be in this file:\n\n${names}\n\n` +
      `Confirmed so far: ${appr.cats} cat${appr.cats === 1 ? '' : 's'} and ${appr.dogs} dog${appr.dogs === 1 ? '' : 's'}` +
      ` \u2014 ${catsLeft} cat and ${dogsLeft} dog spot${dogsLeft === 1 ? '' : 's'} still unfilled.\n\n` +
      `Export the roster anyway?`;
    if (!confirm(msg)) return;
  }

  const animals = [];
  approved.forEach(reg => {
    let pets = [];
    try { pets = JSON.parse(reg.pets || '[]'); } catch(e) {}
    pets.forEach(pet => animals.push({ reg, pet }));
  });
  animals.sort(slotSort);

  // MNSNAP's workbook is three tabs, and the cat tabs are NOT the dog tab minus
  // rows — they are two columns narrower. The section heading already says which
  // sex, and weight appears once instead of twice, so "Sex" and the first
  // "Weight" are absent. Emitting the dog layout for a cat shifted every value
  // two columns left, which is why breed showed a colour and the colour columns
  // showed ages.
  const COMMON = ['', '', "Owner's First Name", "Owner's Last Name", 'Cell Phone', 'Home Phone',
    'Email', 'Street Address', 'City', 'State', 'Zip', "Pet's Name"];
  const TAIL = ['Age Year', 'Age Months', 'Color 1', 'Color 2', 'Breed', 'Weight',
    'Health Concerns', 'Additional Notes'];
  const DOG_HEADERS = COMMON.concat(['Sex', 'Weight'], TAIL);
  const CAT_HEADERS = COMMON.concat(TAIL);

  const num = v => (v === '' || v == null ? '' : v);

  // Only what MNSNAP needs to do the surgery. The owner's own notes, our staff
  // notes and the income answer are ours to act on and stay in the admin panel.
  function additionalNotes(p) {
    return [
      (p.services || []).length ? 'Requested: ' + p.services.join(', ') : '',
      p.shots ? 'Shots current: ' + p.shots : ''
    ].filter(Boolean).join(' | ');
  }

  function sheetFor(list, headers, isDog) {
    const rows = [];
    rows.push(['Check in times: 9am DOGS, 9:30am CATS']);
    rows.push([]);
    rows.push(headers);
    list.forEach((a, i) => {
      const p = a.pet, r = a.reg;
      const row = [
        i + 1,
        slotLabel(p),
        r.owner_first || '', r.owner_last || '',
        r.phone_cell || '', r.phone_home || '',
        r.email || '', r.address || '', r.city || '', r.state || '', r.zip || '',
        p.name || ''
      ];
      // Dogs carry sex and a weight here; the cat tabs have neither column.
      if (isDog) row.push(p.sex || '', num(p.weight));
      row.push(
        num(p.age_years), num(p.age_months),
        p.color1 || '', p.color2 || '',
        p.breed || '',
        num(p.weight),
        p.health || '',
        additionalNotes(p)
      );
      rows.push(row);
    });

    const ws = XLSX.utils.aoa_to_sheet(rows);
    ws['!merges'] = [{ s: { r: 0, c: 0 }, e: { r: 0, c: headers.length - 1 } }];
    const widths = [{ wch: 4 }, { wch: 28 }, { wch: 14 }, { wch: 14 }, { wch: 14 },
      { wch: 14 }, { wch: 26 }, { wch: 22 }, { wch: 14 }, { wch: 6 }, { wch: 8 },
      { wch: 14 }];
    if (isDog) widths.push({ wch: 8 }, { wch: 8 });
    widths.push({ wch: 9 }, { wch: 10 }, { wch: 14 }, { wch: 14 }, { wch: 18 },
      { wch: 8 }, { wch: 28 }, { wch: 34 });
    ws['!cols'] = widths;
    ws['!freeze'] = { xSplit: 0, ySplit: 3 };
    return ws;
  }

  const isCat = a => String(a.pet.species || '').toLowerCase() === 'cat';
  const isFemale = a => String(a.pet.sex || '').toLowerCase() === 'female';
  const dogs = animals.filter(a => !isCat(a));
  const femaleCats = animals.filter(a => isCat(a) && isFemale(a));
  // Anything without a usable sex lands here rather than vanishing from the
  // workbook — better MNSNAP sees it on the wrong tab than not at all.
  const maleCats = animals.filter(a => isCat(a) && !isFemale(a));

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, sheetFor(dogs, DOG_HEADERS, true), 'Dogs');
  XLSX.utils.book_append_sheet(wb, sheetFor(femaleCats, CAT_HEADERS, false), 'Female Cats');
  XLSX.utils.book_append_sheet(wb, sheetFor(maleCats, CAT_HEADERS, false), 'Male Cats');
  XLSX.writeFile(wb, 'MNSNAP-clinic-roster-' + new Date().toISOString().slice(0, 10) + '.xlsx');
};


// ── Short Links ──────────────────────────────────────────────────────────
// wcahs.org/<name> redirects somewhere and counts the hit. The point is a
// printed poster or a QR code: without this there's no way to tell whether
// anyone actually used it.
let _links = [];
let _linkHits = [];

async function renderShortLinks(el) {
  el.innerHTML = '<h1 class="text-2xl font-display font-bold text-sage-800 mb-6">Short Links</h1><p class="text-gray-400">Loading...</p>';
  const data = await api('/admin/short-links');
  if (data.error) { el.innerHTML += '<p class="text-red-500">' + data.error + '</p>'; return; }
  _links = data.links || [];
  _linkHits = data.hits || [];
  paintShortLinks(el);
}

// A 14-day sparkline is enough to see "the poster went up on Tuesday" without
// pulling in a charting library.
function linkSparkline(slug) {
  const days = [];
  for (let i = 13; i >= 0; i--) {
    const d = new Date(); d.setDate(d.getDate() - i);
    days.push(d.toISOString().slice(0, 10));
  }
  const byDay = {};
  _linkHits.filter(h => h.slug === slug).forEach(h => { byDay[h.day] = h.count; });
  const max = Math.max(1, ...days.map(d => byDay[d] || 0));
  const total = days.reduce((n, d) => n + (byDay[d] || 0), 0);
  return `<div class="flex items-end gap-0.5 h-8" title="Last 14 days: ${total} click${total === 1 ? '' : 's'}">
    ${days.map(d => {
      const v = byDay[d] || 0;
      const pct = Math.round((v / max) * 100);
      return `<div style="width:6px;height:${Math.max(2, pct)}%;background:${v ? '#5c6b4e' : '#e8ebe3'};border-radius:1px" title="${d}: ${v}"></div>`;
    }).join('')}
  </div>`;
}

function paintShortLinks(el) {
  let html = `<div class="flex flex-wrap items-center justify-between gap-3 mb-1">
    <h1 class="text-2xl font-display font-bold text-sage-800">Short Links</h1>
    <button onclick="showLinkForm()" class="bg-sage-700 hover:bg-sage-800 text-white font-semibold text-sm px-4 py-2.5 rounded-xl transition">+ New short link</button>
  </div>
  <p class="text-gray-500 text-sm mb-6">Short addresses for posters and social posts. Each one counts how many times it was used.</p>
  <div id="linkFormArea"></div>`;

  if (_links.length === 0) {
    html += '<div class="card p-8 text-center text-gray-400">No short links yet</div>';
  } else {
    html += '<div class="space-y-3">';
    _links.forEach(l => {
      html += `<div class="card p-5 ${l.active ? '' : 'opacity-60'}">
        <div class="flex flex-wrap items-start justify-between gap-4">
          <div class="min-w-0">
            <p class="font-bold text-gray-900 break-all">wcahs.org/${h(l.slug)}
              ${!l.active ? '<span class="text-xs px-2 py-0.5 rounded-full bg-gray-200 text-gray-600 ml-2">off</span>' : ''}
            </p>
            <p class="text-sm text-gray-500 break-all">&rarr; ${h(l.destination)}</p>
            ${l.label ? '<p class="text-xs text-gray-400 mt-1">' + h(l.label) + '</p>' : ''}
          </div>
          <div class="text-right shrink-0">
            <p class="text-2xl font-bold text-sage-700 leading-none">${l.clicks}</p>
            <p class="text-xs text-gray-400 mt-1">click${l.clicks === 1 ? '' : 's'}</p>
          </div>
        </div>
        <div class="flex flex-wrap items-end justify-between gap-3 mt-3">
          ${linkSparkline(l.slug)}
          <p class="text-xs text-gray-400">${l.last_clicked_at ? 'last used ' + timeAgo(l.last_clicked_at) : 'never used'}</p>
        </div>
        <div class="flex flex-wrap gap-4 mt-4 pt-3 border-t border-gray-100">
          <button onclick="copyLink('${h(l.slug)}', this)" class="text-xs text-sage-700 hover:underline font-semibold">Copy link</button>
          <button onclick='editLink(${JSON.stringify(l).replace(/'/g, "&#39;")})' class="text-xs text-sage-700 hover:underline font-semibold">Edit</button>
          <button onclick="toggleLink('${h(l.slug)}', ${l.active ? 0 : 1})" class="text-xs text-gray-500 hover:underline">${l.active ? 'Turn off' : 'Turn on'}</button>
          <button onclick="resetLinkClicks('${h(l.slug)}')" class="text-xs text-gray-500 hover:underline">Reset count</button>
          <button onclick="if(confirm('Delete this short link? Anyone who has it — including on printed posters — will get a Page Not Found.')) deleteLink('${h(l.slug)}')" class="text-xs text-red-400 hover:underline ml-auto">Delete</button>
        </div>
      </div>`;
    });
    html += '</div>';
  }
  el.innerHTML = html;
}

function linkFormHtml(l) {
  const e = l || {};
  const editing = !!l;
  return `<div class="card-warm p-6 mb-6 border border-sage-200" style="background:#f6f7f4;">
    <h3 class="font-bold text-gray-900 mb-4">${editing ? 'Edit short link' : 'New short link'}</h3>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
      <div>
        <label class="block text-xs font-semibold text-gray-600 mb-1">Short address</label>
        <div class="flex items-center gap-1">
          <span class="text-sm text-gray-400">wcahs.org/</span>
          <input id="lkSlug" value="${h(e.slug || '')}" ${editing ? 'disabled' : ''} class="flex-1 border border-sage-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-sage-400 ${editing ? 'bg-gray-100 text-gray-500' : ''}" placeholder="fall-fest">
        </div>
        <p class="text-xs text-gray-400 mt-1">${editing ? "The address can't be changed — posters may already have it." : 'Lowercase letters, numbers and dashes.'}</p>
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-600 mb-1">Goes to</label>
        <input id="lkDest" value="${h(e.destination || '')}" class="w-full border border-sage-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-sage-400" placeholder="/events/snap or https://...">
        <p class="text-xs text-gray-400 mt-1">A page on this site, or a full address elsewhere.</p>
      </div>
      <div class="md:col-span-2">
        <label class="block text-xs font-semibold text-gray-600 mb-1">What's it for <span class="font-normal text-gray-400">(optional)</span></label>
        <input id="lkLabel" value="${h(e.label || '')}" class="w-full border border-sage-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-sage-400" placeholder="e.g. Clinic poster in the Waseca library">
      </div>
    </div>
    <div id="lkError" class="hidden rounded-xl p-3 mb-4 text-sm" style="background:#fef3c7;border:1px solid #fde68a;color:#92400e;"></div>
    <div class="flex flex-wrap gap-2 items-center">
      <button onclick="saveLink(${editing ? `'${h(e.slug)}'` : 'null'})" class="bg-sage-700 hover:bg-sage-800 text-white font-semibold text-sm px-5 py-2.5 rounded-xl transition">Save</button>
      <button onclick="document.getElementById('linkFormArea').innerHTML=''" class="text-gray-500 text-sm px-4 py-2.5 hover:text-gray-700 transition">Cancel</button>

    </div>
  </div>`;
}

window.showLinkForm = function() { document.getElementById('linkFormArea').innerHTML = linkFormHtml(); window.scrollTo(0, 0); };
window.editLink = function(l) { document.getElementById('linkFormArea').innerHTML = linkFormHtml(l); window.scrollTo(0, 0); };

window.saveLink = async function(existingSlug) {
  const errEl = document.getElementById('lkError');
  const body = {
    destination: document.getElementById('lkDest').value.trim(),
    label: document.getElementById('lkLabel').value.trim(),
  };
  let res;
  if (existingSlug) {
    body.slug = existingSlug;
    res = await api('/admin/short-links', { method: 'PUT', body });
  } else {
    body.slug = document.getElementById('lkSlug').value.trim();
    res = await api('/admin/short-links', { method: 'POST', body });
  }
  if (res.error) {
    errEl.textContent = res.error;
    errEl.classList.remove('hidden');
    return;
  }
  document.getElementById('linkFormArea').innerHTML = '';
  await renderShortLinks(document.getElementById('content'));
};

window.toggleLink = async function(slug, active) {
  const res = await api('/admin/short-links', { method: 'PUT', body: { slug, active: !!active } });
  if (res.error) { alert(res.error); return; }
  await renderShortLinks(document.getElementById('content'));
};

window.resetLinkClicks = async function(slug) {
  if (!confirm(`Reset the click count for wcahs.org/${slug} back to zero?\n\nThe link keeps working — only the count and its history are cleared. Useful when the same link goes onto a new poster.`)) return;
  const res = await api('/admin/short-links', { method: 'PUT', body: { slug, reset_clicks: true } });
  if (res.error) { alert(res.error); return; }
  const area = document.getElementById('linkFormArea');
  if (area) area.innerHTML = '';
  await renderShortLinks(document.getElementById('content'));
};

window.deleteLink = async function(slug) {
  const res = await api('/admin/short-links?slug=' + encodeURIComponent(slug), { method: 'DELETE' });
  if (res.error) { alert(res.error); return; }
  await renderShortLinks(document.getElementById('content'));
};

window.copyLink = function(slug, btn) {
  const text = 'https://wcahs.org/' + slug;
  const done = () => { const t = btn.textContent; btn.textContent = 'Copied'; setTimeout(() => { btn.textContent = t; }, 1500); };
  if (navigator.clipboard) navigator.clipboard.writeText(text).then(done).catch(() => prompt('Copy this link:', text));
  else prompt('Copy this link:', text);
};

// A deep link has to survive a slow render. Every one of these links is opened
// from a notification email, which in practice means a phone on cellular, where
// the inbox fetch routinely takes longer than any fixed timer we might guess at.
// The old code waited 500ms, looked once, and cleared the hash whether or not it
// had found anything — so a slow load silently dropped the admin on a plain
// inbox with the report they tapped still buried and collapsed, and reloading
// couldn't retry because the hash was already gone.
//
// So: poll for the element, and only consume the hash once we've actually used
// it. If we time out the hash stays put and a reload is a real second chance.
function whenRendered(elementId, onFound, timeoutMs) {
  const started = Date.now();
  const deadline = started + (timeoutMs || 15000);
  (function poll() {
    const el = document.getElementById(elementId);
    if (el) return onFound(el);
    if (Date.now() > deadline) {                 // leave the hash alone
      clog('deep_link', { outcome: 'timeout', target: elementId });
      return;
    }
    setTimeout(poll, 100);
  })();
}

// Which admin page the current hash points at, or null. Split out from the
// handler so showDashboard() can navigate straight there: it used to render the
// last-visited page and *then* render the deep link's page 100ms later, and
// because both renders are async the slower fetch won and could wipe out the
// page the link had just opened.
function deepLinkPage() {
  const hash = window.location.hash;
  if (hash.startsWith('#clinic-reg-')) return 'forms';
  if (hash.startsWith('#inbox-lf-')) return 'lost-found';
  if (hash.startsWith('#inbox-')) return 'submissions';
  return null;
}

// Go wherever the hash points. Returns false when there's no (permitted) link,
// so the caller can fall back to the saved page.
function followDeepLink() {
  const page = deepLinkPage();
  if (!page) return false;
  if (!(PAGES_BY_ROLE[currentRole] || PAGES_BY_ROLE.staff).includes(page)) {
    clog('deep_link', { outcome: 'not_permitted', hash: window.location.hash.slice(0, 60), role: currentRole });
    return false;
  }
  if (window.location.hash.startsWith('#inbox-lf-')) {
    // This one picks its own page: the report may have left the inbox.
    openLinkedReport(window.location.hash.replace('#inbox-lf-', ''));
    return true;
  }
  navigate(page);
  handleDeepLink();
  return true;
}

// iPhone Safari can hand an email link to a tab that already has the admin
// open. When only the #fragment differs, that's not a page load — nothing
// re-ran and she was left looking at whatever page was already up.
window.addEventListener('hashchange', () => { if (currentUsername) followDeepLink(); });

// A lost & found notification email is only accurate until someone acts on
// it. The link used to assume the report was still pending in the inbox; once
// anyone had approved it (two mailboxes get every email) the link opened an
// inbox the report was no longer in and silently gave up — "it goes back to
// the last page". Look the report up first and go to wherever it lives now.
async function openLinkedReport(id) {
  document.getElementById('content').innerHTML = '<p class="text-gray-400">Loading...</p>';
  const rows = await api('/admin/lost-found');
  const r = Array.isArray(rows) ? rows.find(x => String(x.id) === String(id)) : null;
  clog('deep_link', { kind: 'lf', id, outcome: !r ? 'deleted' : r.status });
  window.location.hash = '';
  if (!r) { _lfManageFilter = null; navigate('lost-found'); toast('That report has been deleted.', 'error'); return; }
  const monthAgo = new Date(Date.now() - 30*24*60*60*1000).toISOString();
  _lfManageFilter = r.status === 'pending' ? 'review' : r.status === 'rejected' ? 'rejected'
    : r.status === 'resolved' ? 'resolved' : (r.created_at >= monthAgo ? 'active' : 'expired');
  navigate('lost-found');
  if (r.status === 'approved') toast('Already approved — this report is live on the website’s Lost & Found page.');
  else if (r.status === 'resolved') toast('This report has already been marked resolved.');
  else if (r.status === 'rejected') toast('This report was rejected — it is not on the website.');
  whenRendered('lf-card-' + r.id, () => openLFCard(r.id));
}

function handleDeepLink() {
  const hash = window.location.hash;
  if (hash && hash.startsWith('#clinic-reg-')) {
    // #clinic-reg-<eventId>-<registrationId>[-<action>]
    // The event is needed because applications load per event. The optional
    // action comes from the Approve / Needs review buttons in the notification
    // email — it only ever PROPOSES the change. Mail scanners prefetch links,
    // so a link that acted on its own would let a spam filter approve
    // applications; a human has to confirm here.
    const parts = hash.replace('#clinic-reg-', '').split('-');
    const evId = parts.length > 1 ? parts[0] : null;
    const regId = parts.length > 1 ? parts[1] : parts[0];
    const action = parts.length > 2 ? parts[2] : null;
    if (evId) _formEventId = Number(evId);
    whenRendered('clinic-reg-' + regId, (el) => {
      el.classList.add('ring-2', 'ring-sage-400');
      el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      window.location.hash = '';
      if (action && ['approved', 'approve', 'ineligible', 'cancelled'].includes(action)) {
        const status = action === 'approve' ? 'approved' : action;
        const row = _clinicData.find(r => String(r.id) === String(regId));
        if (!row) { alert('That application could no longer be found.'); return; }
        if (row.status === status) return;
        if (confirm(`Mark ${row.owner_name}'s application as "${status}"?`)) {
          setClinicStatus(row.id, status);
        }
      }
    });
    return;
  }
  if (!hash || !hash.startsWith('#inbox-')) return;
  // Format: #inbox-sub-42 or #inbox-lf-42
  const itemId = hash.replace('#inbox-', '');
  whenRendered(itemId, (el) => {
    const arrow = document.getElementById(itemId.replace('sub-', 'sub-arrow-').replace('lf-', 'lf-arrow-'));
    el.classList.remove('hidden');
    if (arrow) arrow.style.transform = 'rotate(180deg)';
    el.closest('.inbox-item')?.scrollIntoView({ behavior: 'smooth', block: 'center' });
    window.location.hash = '';
  });
}

checkAuth();
